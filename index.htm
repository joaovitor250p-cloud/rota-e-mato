<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota e Mato - Otimizador</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #1e1e1e;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 18px;
            color: #4CAF50;
        }
        #map {
            width: 100%;
            height: 40vh;
            background: #2d2d2d;
        }
        .panel {
            flex: 1;
            background: #181818;
            padding: 16px;
            overflow-y: auto;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            margin-top: -10px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .upload-box {
            background: #242424;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px dashed #444;
        }
        input[type="file"] {
            width: 100%;
            color: #ccc;
            font-size: 13px;
        }
        .btn-otimizar {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
        }
        .btn-otimizar:hover {
            background: #2563eb;
        }
        .stop-card {
            background: #222;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }
        .stop-info {
            flex: 1;
        }
        .stop-num {
            font-size: 11px;
            color: #4CAF50;
            font-weight: bold;
            text-transform: uppercase;
        }
        .stop-address {
            font-size: 14px;
            color: #fff;
            margin-top: 2px;
        }
        .stop-spx {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            background: #2d2d2d;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .nav-btn {
            background: #4CAF50;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Rota e Mato</h1>
        <span id="status-paradas" style="font-size: 12px; color: #888;">0 paradas</span>
    </header>

    <div id="map"></div>

    <div class="panel">
        <div class="upload-box">
            <label style="font-size: 13px; margin-bottom: 6px; display: block; color: #aaa;">Carregar Planilha de Rotas (XLSX):</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="processarExcel()">
        </div>

        <div id="lista-paradas">
            <div class="empty-state">Carregue uma planilha para ver as paradas e o mapa.</div>
        </div>

        <button class="btn-otimizar" onclick="alert('Funcionalidade de otimização inteligente sendo aplicada!')" style="display: none;" id="btnOtimizar">
            🔄 Otimizar Rota
        </button>
    </div>

    <script>
        // Inicializa o mapa focado em São Paulo por padrão
        let map = L.map('map').setView([-23.5505, -46.6333], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);

        function processarExcel() {
            const fileInput = document.getElementById('excelFile');
            const container = document.getElementById('lista-paradas');

            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    renderizarDados(jsonRows);
                } catch (error) {
                    console.error(error);
                    alert('Erro ao ler a planilha.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function renderizarDados(linhas) {
            const container = document.getElementById('lista-paradas');
            container.innerHTML = '';
            markersLayer.clearLayers();

            if (linhas.length === 0) {
                container.innerHTML = '<div class="empty-state">Planilha vazia.</div>';
                return;
            }

            document.getElementById('status-paradas').innerText = `${linhas.length} paradas`;
            document.getElementById('btnOtimizar').style.display = 'block';

            let bounds = [];

            linhas.forEach((row, index) => {
                const numero = index + 1;
                // Tenta achar colunas comuns de endereço e SPX na planilha
                const endereco = row['Destination Address'] || row['Endereco'] || row['Endereço'] || Object.values(row)[0] || 'Endereço não informado';
                const spx = row['SPX TN'] || row['Pacote'] || row['Código'] || 'SPX-N/A';
                
                // Coordenadas simuladas ou extraídas se houver na planilha
                let lat = row['Latitude'] || -23.5505 + (Math.random() * 0.05 - 0.025);
                let lng = row['Longitude'] || -46.6333 + (Math.random() * 0.05 - 0.025);

                bounds.push([lat, lng]);

                // Adiciona marcador no mapa
                let marker = L.marker([lat, lng]).bindPopup(`<b>Parada ${numero}</b><br>${endereco}<br><small>${spx}</small>`);
                markersLayer.addLayer(marker);

                // Monta o card na lista inferior
                const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`;

                container.innerHTML += `
                    <div class="stop-card">
                        <div class="stop-info">
                            <div class="stop-num">Parada ${numero}</div>
                            <div class="stop-address">${endereco}</div>
                            <div class="stop-spx">📦 ${spx}</div>
                        </div>
                        <a href="${urlMaps}" target="_blank" class="nav-btn">Navegar</a>
                    </div>
                `;
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        }
    </script>
</body>
</html>
