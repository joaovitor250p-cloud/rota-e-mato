<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota e Mato - Excel</title>
    <!-- Importando a biblioteca SheetJS para ler arquivos XLSX no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            color: #4CAF50;
            margin-bottom: 4px;
            text-align: center;
        }
        p.subtitle {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #b0b0b0;
        }
        input[type="file"] {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        button:hover {
            background: #45a049;
        }
        .stop-item {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }
        .stop-info {
            flex: 1;
            margin-right: 10px;
        }
        .stop-num {
            font-size: 11px;
            color: #4CAF50;
            font-weight: bold;
            text-transform: uppercase;
        }
        .stop-address {
            font-size: 14px;
            color: #fff;
            margin-top: 2px;
        }
        .nav-btn {
            background: #2196F3;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: #1976D2;
        }
        #lista-paradas {
            margin-top: 15px;
        }
        .empty-state {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #4CAF50;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rota e Mato</h1>
        <p class="subtitle">Leitor de Planilha Excel (XLSX)</p>

        <div class="card">
            <label for="excelFile">Selecione o arquivo XLSX:</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls">
            <button onclick="processarExcel()">Ler Planilha e Gerar Rota</button>
        </div>

        <div class="card">
            <label>Paradas da Planilha:</label>
            <div id="lista-paradas">
                <div class="empty-state">Nenhuma planilha carregada ainda.</div>
            </div>
        </div>
    </div>

    <script>
        function processarExcel() {
            const fileInput = document.getElementById('excelFile');
            const container = document.getElementById('lista-paradas');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um arquivo Excel (.xlsx)!');
                return;
            }

            const file = fileInput.files[0];
            container.innerHTML = '<div class="loading">Lendo planilha...</div>';

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // Pega a primeira aba da planilha
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // Converte a aba em uma lista de objetos (linhas)
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    exibirParadas(jsonRows);
                } catch (error) {
                    console.error(error);
                    container.innerHTML = '<div class="empty-state" style="color: #ff5252;">Erro ao ler o arquivo Excel.</div>';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exibirParadas(linhas) {
            const container = document.getElementById('lista-paradas');
            container.innerHTML = '';

            // Filtra linhas vazias
            const linhasValidas = linhas.filter(row => row && row.length > 0);

            if (linhasValidas.length === 0) {
                container.innerHTML = '<div class="empty-state">A planilha está vazia.</div>';
                return;
            }

            let contadorParadas = 0;

            // Percorre as linhas da planilha (pulando o cabeçalho se houver, ou lendo tudo)
            linhasValidas.forEach((row, rowIndex) => {
                // Junta todas as colunas da linha em um texto só para garantir que achamos o endereço
                let textoLinha = row.map(cell => String(cell || '')).join(' - ');
                
                // Ignora linhas muito curtas (cabeçalhos ou códigos isolados)
                if (textoLinha.trim().length < 5) return;

                contadorParadas++;
                const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(textoLinha)}`;

                const itemHTML = `
                    <div class="stop-item">
                        <div class="stop-info">
                            <div class="stop-num">Parada ${contadorParadas}</div>
                            <div class="stop-address">${textoLinha}</div>
                        </div>
                        <a href="${urlMaps}" target="_blank" class="nav-btn">Navegar</a>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });

            if (contadorParadas === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum dado válido encontrado na planilha.</div>';
            }
        }
    </script>

</body>
</html>
