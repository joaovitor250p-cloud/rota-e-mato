<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MB DRY FIT | Performance Esportiva Premium</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;0,900;1,800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    /* ==========================================================================
       1. VARIÁVEIS DE DESIGN & RESET
       ========================================================================== */
    :root {
      --bg-primary: #0a0a0a;
      --bg-secondary: #121212;
      --bg-card: #171717;
      --bg-card-hover: #1f1f1f;
      --accent-orange: #ff5500;
      --accent-orange-glow: rgba(255, 85, 0, 0.4);
      --accent-orange-dark: #d94400;
      --text-white: #ffffff;
      --text-gray: #a3a3a3;
      --text-muted: #666666;
      --border-dark: #262626;
      --border-orange: rgba(255, 85, 0, 0.35);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --font-display: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
      --transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-white);
      font-family: var(--font-body);
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbar personalizada */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: #2b2b2b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-orange);
    }

    a {
      text-decoration: none;
      color: inherit;
      transition: var(--transition);
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      background: none;
      transition: var(--transition);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 1.25rem;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      text-align: center;
    }

    .section-title span {
      color: var(--accent-orange);
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-gray);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
    }

    /* ==========================================================================
       2. TELA DE ABERTURA (SPLASH / LOADING SCREEN)
       ========================================================================== */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050505;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    .splash-logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .splash-symbol {
      width: 60px;
      height: 38px;
      margin-bottom: 15px;
      position: relative;
      opacity: 0;
      transform: scale(0.6);
      animation: symbolPop 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .splash-symbol svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--accent-orange);
      stroke-width: 5;
      filter: drop-shadow(0 0 15px var(--accent-orange-glow));
    }

    .splash-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--text-white);
      overflow: hidden;
      display: flex;
      gap: 12px;
      align-items: center;
    }
