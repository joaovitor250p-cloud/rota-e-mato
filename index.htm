<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rota e Mato - Pro</title>
    <!-- SheetJS para ler Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF para gerar o PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-bar {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .route-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .route-time {
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        #map {
            width: 100%;
            height: 42vh;
            background: #e2e8f0;
        }

        .bottom-sheet {
            flex: 1;
            background: var(--surface);
            padding: 16px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            margin-top: -15px;
            position: relative;
            transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out;
        }

        /* Classes para animação de transição suave ao deslizar */
        .slide-left {
            transform: translateX(-30px);
            opacity: 0;
        }
        .slide-right {
            transform: translateX(30px);
            opacity: 0;
        }

        .upload-area {
            background: #f8fafc;
            border: 2px dashed var(--border);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 12px;
        }

        .upload-area input {
            font-size: 13px;
            width: 100%;
            color: var(--text-muted);
        }

        .stop-header-info {
            margin-bottom: 10px;
        }

        .stop-address-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 2px;
        }

        .stop-meta {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .action-buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .action-btn {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .action-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn.success {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .action-btn.danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .action-btn span {
            font-size: 16px;
        }

        .details-list {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-val {
            font-weight: 600;
            color: var(--text-dark);
        }

        .status-badge-tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }

        .global-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-global {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-opt { background: var(--primary); color: white; }
        .btn-pdf { background: var(--success); color: white; }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 13px;
        }

        .circuit-marker {
            background: #1e293b;
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .circuit-marker.entregue { background: var(--success); }
        .circuit-marker.nao-entregue { background: var(--danger); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="route-title" id="info-header-titulo">Carregue sua rota</div>
        <div class="route-time" id="info-tempo">-- km | -- min</div>
    </div>

    <div id="map"></div>

    <div class="bottom-sheet" id="painel-conteudo">
        <div class="upload-area">
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="processarPlanilha()">
        </div>

        <div id="parada-ativa-container">
            <div class="empty-state">Nenhuma planilha carregada. Selecione o arquivo XLSX para começar. Deslize para os lados para navegar entre as paradas.</div>
        </div>

        <div class="global-actions" id="botoes-globais" style="display: none;">
            <button class="btn-global btn-opt" onclick="otimizarRota()">⚡ Otimizar</button>
            <button class="btn-global btn-pdf" onclick="gerarPDF()">📄 Gerar PDF</button>
        </div>
    </div>

    <script>
        let map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let listaParadas = [];
        let indiceAtual = 0;

        let touchStartX = 0;
        let touchEndX = 0;
        
        const painelEl = document.getElementById('painel-conteudo');
        painelEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
        painelEl.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            tratarSwipe();
        });

        function tratarSwipe() {
            if (listaParadas.length === 0) return;
            let diferenca = touchEndX - touchStartX;
            if (diferenca > 50) {
                // Deslizou para a direita -> Anterior
                if (indiceAtual > 0) {
                    animarTrocaParada('direita', () => { indiceAtual--; });
                }
            } else if (diferenca < -50) {
                // Deslizou para a esquerda -> Próxima
                if (indiceAtual < listaParadas.length - 1) {
                    animarTrocaParada('esquerda', () => { indiceAtual++; });
                }
            }
        }

        function animarTrocaParada(direcao, callback) {
            painelEl.classList.add(direcao === 'esquerda' ? 'slide-left' : 'slide-right');
            setTimeout(() => {
                callback();
                renderizarParadaAtiva();
                painelEl.classList.remove('slide-left', 'slide-right');
            }, 200);
        }

        function processarPlanilha() {
            const fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    listaParadas = rows.map((row, idx) => {
                        return {
                            id: idx + 1,
                            endereco: row['Destination Address'] || row['Endereco'] || Object.values(row)[0] || 'Endereço não informado',
                            spx: row['SPX TN'] || row['Pacote'] || 'SPX-N/A',
                            bairro: row['Bairro'] || 'São Paulo',
                            status: 'Pendente',
                            lat: parseFloat(row['Latitude']) || (-23.5505 + (Math.random() * 0.04 - 0.02)),
                            lng: parseFloat(row['Longitude']) || (-46.6333 + (Math.random() * 0.04 - 0.02))
                        };
                    });

                    indiceAtual = 0;
                    atualizarInterface();
                    document.getElementById('botoes-globais').style.display = 'flex';
                } catch (err) {
                    console.error(err);
                    alert('Erro ao processar a planilha.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function calcularMetricasRota() {
            let distanciaTotalKm = 0;
            for (let i = 0; i < listaParadas.length - 1; i++) {
                let p1 = listaParadas[i];
                let p2 = listaParadas[i+1];
                let dLat = (p2.lat - p1.lat) * 111;
                let dLng = (p2.lng - p1.lng) * 111;
                distanciaTotalKm += Math.sqrt(dLat*dLat + dLng*dLng);
            }
            if(distanciaTotalKm === 0 && listaParadas.length > 0) distanciaTotalKm = listaParadas.length * 1.2;

            let tempoDeslocamentoMin = Math.round((distanciaTotalKm / 30) * 60);
            let tempoEsperaMin = listaParadas.length * 3;
            let tempoTotalMin = tempoDeslocamentoMin + tempoEsperaMin;

            return {
                km: distanciaTotalKm.toFixed(1),
                min: tempoTotalMin
            };
        }

        function atualizarInterface() {
            if (listaParadas.length === 0) return;

            markersLayer.clearLayers();
            let bounds = [];

            listaParadas.forEach((p, idx) => {
                bounds.push([p.lat, p.lng]);
                
                let className = 'circuit-marker';
                if(p.status === 'Entregue') className += ' entregue';
                if(p.status === 'Não Entregue') className += ' nao-entregue';

                let customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="${className}">${idx + 1}</div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                let marker = L.marker([p.lat, p.lng], { icon: customIcon }).bindPopup(`<b>Parada ${idx + 1}</b><br>${p.endereco}`);
                markersLayer.addLayer(marker);
            });

            let metricas = calcularMetricasRota();
            document.getElementById('info-tempo').innerText = `${metricas.km} km | ${metricas.min} min`;

            renderizarParadaAtiva();
        }

        function renderizarParadaAtiva() {
            if (listaParadas.length === 0) return;
            let p = listaParadas[indiceAtual];

            // Faz o mapa dar um zoom suave direto na parada ativa
            map.flyTo([p.lat, p.lng], 16, { animate: true, duration: 0.8 });

            document.getElementById('info-header-titulo').innerText = `${indiceAtual + 1}/${listaParadas.length} paradas`;

            const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}`;

            let statusHtml = `<span class="status-badge-tag" style="background:#f1f5f9; color:#64748b;">Pendente</span>`;
            if(p.status === 'Entregue') statusHtml = `<span class="status-badge-tag" style="background:rgba(22,163,74,0.1); color:var(--success);">Entregue</span>`;
            if(p.status === 'Não Entregue') statusHtml = `<span class="status-badge-tag" style="background:rgba(220,38,38,0.1); color:var(--danger);">Não Entregue</span>`;

            const container = document.getElementById('parada-ativa-container');
            container.innerHTML = `
                <div class="stop-header-info">
                    <div class="stop-address-title">${p.endereco}</div>
                    <div class="stop-meta">Deslize 👈 👉 para alternar paradas</div>
                </div>

                <div class="action-buttons-grid">
                    <a href="${urlMaps}" target="_blank" class="action-btn primary" style="text-decoration: none;">
                        <span>🧭</span> Navegar
                    </a>
                    <button class="action-btn success" onclick="mudarStatus('Entregue')">
                        <span>✅</span> Entregue
                    </button>
                    <button class="action-btn danger" onclick="mudarStatus('Não Entregue')">
                        <span>❌</span> Não ent.
                    </button>
                </div>

                <div class="details-list">
                    <div class="detail-row">
                        <span class="detail-label">📦 SPX TN</span>
                        <span class="detail-val">${p.spx}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">📌 Status</span>
                        <span class="detail-val">${statusHtml}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">⏱️ Espera parada</span>
                        <span class="detail-val">3 min</span>
                    </div>
                </div>
            `;
        }

        function mudarStatus(novoStatus) {
            if (listaParadas.length === 0) return;
            listaParadas[indiceAtual].status = novoStatus;
            
            if (indiceAtual < listaParadas.length - 1) {
                animarTrocaParada('esquerda', () => { indiceAtual++; });
            } else {
                atualizarInterface();
            }
        }

        function otimizarRota() {
            if (listaParadas.length === 0) return;

            let naoVisitados = [...listaParadas];
            let otimizadas = [];
            let atual = naoVisitados.shift();
            otimizadas.push(atual);

            while (naoVisitados.length > 0) {
                let maisProximoIndex = 0;
                let menorDistancia = Infinity;

                for (let i = 0; i < naoVisitados.length; i++) {
                    let p = naoVisitados[i];
                    let dist = Math.pow(p.lat - atual.lat, 2) + Math.pow(p.lng - atual.lng, 2);
                    if (dist < menorDistancia) {
                        menorDistancia = dist;
                        maisProximoIndex = i;
                    }
                }
                atual = naoVisitados.splice(maisProximoIndex, 1)[0];
                otimizadas.push(atual);
            }

            listaParadas = otimizadas;
            indiceAtual = 0;
            atualizarInterface();
        }

        function gerarPDF() {
            if (listaParadas.length === 0) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("ROTA E MATO - Relatorio de Rota Otimizada", 14, 20);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Total de Paradas: ${listaParadas.length}`, 14, 28);
            doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 14, 34);

            let y = 45;
            listaParadas.forEach((item, index) => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
                doc.setFont("helvetica", "bold");
                doc.text(`Parada ${index + 1} [${item.status}]:`, 14, y);
                doc.setFont("helvetica", "normal");
                doc.text(`Endereco: ${item.endereco}`, 32, y);
                doc.text(`Pacote SPX: ${item.spx}`, 32, y + 5);

                doc.setLineDash([1, 1], 0);
                doc.line(14, y + 8, 196, y + 8);
                doc.setLineDash([]);
                y += 14;
            });

            doc.save("rota-otimizada-spx.pdf");
        }
    </script>
</body>
</html>
