<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rota e Mato - App</title>
    <!-- SheetJS para ler Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF para gerar o PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Leaflet CSS para o Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --surface: #ffffff;
            --primary: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar / Header estilo app */
        .top-bar {
            background: var(--surface);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .menu-icon {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-dark);
            background: none;
            border: none;
        }

        .route-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .route-time {
            background: #f1f5f9;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
        }

        /* Mapa */
        #map {
            width: 100%;
            height: 45vh;
            background: #e2e8f0;
        }

        /* Painel Inferior Estilo Card Flutuante */
        .bottom-sheet {
            flex: 1;
            background: var(--surface);
            padding: 16px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            margin-top: -15px;
        }

        .upload-area {
            background: #f8fafc;
            border: 2px dashed var(--border);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 14px;
        }

        .upload-area input {
            font-size: 13px;
            width: 100%;
            color: var(--text-muted);
        }

        /* Informações da Parada Selecionada */
        .stop-header-info {
            margin-bottom: 12px;
        }

        .stop-address-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .stop-meta {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Barra de Ações Rápidas (Botões estilo print) */
        .action-buttons-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .action-btn {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            transition: background 0.2s;
        }

        .action-btn.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn span {
            font-size: 16px;
        }

        /* Detalhes do Pacote (SPX / Bairro / ID) */
        .details-list {
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-val {
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Botões Globais de Rota (Otimizar e PDF) */
        .global-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-global {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
        }

        .btn-opt {
            background: var(--primary);
            color: white;
        }

        .btn-pdf {
            background: var(--success);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="top-bar">
        <button class="menu-icon">☰</button>
        <div class="route-title" id="info-header-titulo">Carregue sua rota</div>
        <div class="route-time" id="info-tempo">--:--</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Painel de Controle Inferior -->
    <div class="bottom-sheet" id="painel-conteudo">
        
        <div class="upload-area">
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="processarPlanilha()">
        </div>

        <div id="parada-ativa-container">
            <div class="empty-state">Nenhuma planilha carregada. Selecione o arquivo XLSX para começar.</div>
        </div>

        <div class="global-actions" id="botoes-globais" style="display: none;">
            <button class="btn-global btn-opt" onclick="otimizarRota()">⚡ Otimizar Rota</button>
            <button class="btn-global btn-pdf" onclick="gerarPDF()">📄 Gerar PDF</button>
        </div>

    </div>

    <script>
        let map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = layerGroup = L.layerGroup().addTo(map);
        let listaParadas = [];
        let indiceAtual = 0;

        function processarPlanilha() {
            const fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    listaParadas = rows.map((row, idx) => {
                        return {
                            id: idx + 1,
                            endereco: row['Destination Address'] || row['Endereco'] || Object.values(row)[0] || 'Endereço não informado',
                            spx: row['SPX TN'] || row['Pacote'] || 'SPX-N/A',
                            bairro: row['Bairro'] || 'São Paulo',
                            lat: parseFloat(row['Latitude']) || (-23.5505 + (Math.random() * 0.04 - 0.02)),
                            lng: parseFloat(row['Longitude']) || (-46.6333 + (Math.random() * 0.04 - 0.02))
                        };
                    });

                    indiceAtual = 0;
                    atualizarInterface();
                    document.getElementById('botoes-globais').style.display = 'flex';
                } catch (err) {
                    console.error(err);
                    alert('Erro ao processar a planilha.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function atualizarInterface() {
            if (listaParadas.length === 0) return;

            markersLayer.clearLayers();
            let bounds = [];

            listaParadas.forEach((p, idx) => {
                bounds.push([p.lat, p.lng]);
                let marker = L.marker([p.lat, p.lng]).bindPopup(`<b>Parada ${idx + 1}</b><br>${p.endereco}`);
                markersLayer.addLayer(marker);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [40, 40] });
            }

            renderizarParadaAtiva();
        }

        function renderizarParadaAtiva() {
            if (listaParadas.length === 0) return;
            let p = listaParadas[indiceAtual];

            document.getElementById('info-header-titulo').innerText = `${indiceAtual + 1}/${listaParadas.length} paradas`;
            document.getElementById('info-tempo').innerText = `${Math.floor(listaParadas.length * 4.5)} min`;

            const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.endereco)}`;

            const container = document.getElementById('parada-ativa-container');
            container.innerHTML = `
                <div class="stop-header-info">
                    <div class="stop-address-title">${p.endereco}</div>
                    <div class="stop-meta">Parada ${indiceAtual + 1} de ${listaParadas.length}</div>
                </div>

                <div class="action-buttons-grid">
                    <a href="${urlMaps}" target="_blank" class="action-btn primary" style="text-decoration: none;">
                        <span>🧭</span> Navegar
                    </a>
                    <button class="action-btn" onclick="proximaParada()">
                        <span>⏭️</span> Próxima
                    </button>
                    <button class="action-btn" onclick="alert('Marcado como não entregue')">
                        <span>❌</span> Não ent.
                    </button>
                    <button class="action-btn" onclick="alert('Marcado como entregue!')">
                        <span>✅</span> Entregue
                    </button>
                </div>

                <div class="details-list">
                    <div class="detail-row">
                        <span class="detail-label">📦 SPX TN</span>
                        <span class="detail-val">${p.spx}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">📍 Bairro</span>
                        <span class="detail-val">${p.bairro}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">🆔 ID Parada</span>
                        <span class="detail-val">C${indiceAtual + 1}</span>
                    </div>
                </div>
            `;
        }

        function proximaParada() {
            if (indiceAtual < listaParadas.length - 1) {
                indiceAtual++;
                renderizarParadaAtiva();
            } else {
                alert('Você chegou na última parada da rota!');
            }
        }

        function otimizarRota() {
            if (listaParadas.length === 0) return;

            let naoVisitados = [...listaParadas];
            let otimizadas = [];
            let atual = naoVisitados.shift();
            otimizadas.push(atual);

            while (naoVisitados.length > 0) {
                let maisProximoIndex = 0;
                let menorDistancia = Infinity;

                for (let i = 0; i < naoVisitados.length; i++) {
                    let p = naoVisitados[i];
                    let dist = Math.pow(p.lat - atual.lat, 2) + Math.pow(p.lng - atual.lng, 2);
                    if (dist < menorDistancia) {
                        menorDistancia = dist;
                        maisProximoIndex = i;
                    }
                }
                atual = naoVisitados.splice(maisProximoIndex, 1)[0];
                otimizadas.push(atual);
            }

            listaParadas = otimizadas;
            indiceAtual = 0;
            atualizarInterface();
            alert('Rota otimizada com sucesso para menor trajeto!');
        }

        function gerarPDF() {
            if (listaParadas.length === 0) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("ROTA E MATO - Relatorio de Rota Otimizada", 14, 20);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Total de Paradas: ${listaParadas.length}`, 14, 28);
            doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 14, 34);

            let y = 45;
            listaParadas.forEach((item, index) => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }
                doc.setFont("helvetica", "bold");
                doc.text(`Parada ${index + 1}:`, 14, y);
                doc.setFont("helvetica", "normal");
                doc.text(`Endereco: ${item.endereco}`, 32, y);
                doc.text(`Pacote SPX: ${item.spx}`, 32, y + 5);

                doc.setLineDash([1, 1], 0);
                doc.line(14, y + 8, 196, y + 8);
                doc.setLineDash([]);
                y += 14;
            });

            doc.save("rota-otimizada-spx.pdf");
        }
    </script>
</body>
</html>
