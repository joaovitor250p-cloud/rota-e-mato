<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Finanças João & Raquel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center">

  <div id="root" class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col relative shadow-xl pb-24"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- CONFIGURAÇÃO E DADOS BASE ---
    const CATEGORIAS = [
      { id: 'Apartamento', label: 'Apartamento', icon: '🏠' },
      { id: 'Mão de Obra', label: 'Mão de Obra', icon: '🔨' },
      { id: 'Delivery', label: 'Delivery', icon: '🍔' },
      { id: 'Mercado', label: 'Mercado', icon: '🛒' },
      { id: 'Combustível', label: 'Combustível', icon: '⛽' },
      { id: 'Lazer', label: 'Lazer', icon: '🎮' },
      { id: 'Outros', label: 'Outros', icon: '📦' }
    ];

    const CONTAS_FIXAS_BASE = [
      { id: 'f_internet', nome: 'Internet', valorPadrao: 120, dia: 5, responsavel: 'Casal', categoria: 'Apartamento' },
      { id: 'f_aluguel', nome: 'Aluguel', valorPadrao: 1500, dia: 20, responsavel: 'Casal', categoria: 'Apartamento' },
      { id: 'f_luz', nome: 'Luz', valorPadrao: 180, dia: 20, responsavel: 'Casal', categoria: 'Apartamento' },
      { id: 'f_agua', nome: 'Água', valorPadrao: 80, dia: 20, responsavel: 'Casal', categoria: 'Apartamento' },
    ];

    const CARTAO_OPCOES = [
      { id: 'nenhum', label: 'Dinheiro / Pix / Débito' },
      { id: 'j5', label: 'Cartão João (Dia 5)', dono: 'João', dia: 5 },
      { id: 'j20', label: 'Cartão João (Dia 20)', dono: 'João', dia: 20 },
      { id: 'r5', label: 'Cartão Raquel (Dia 5)', dono: 'Raquel', dia: 5 },
      { id: 'r20', label: 'Cartão Raquel (Dia 20)', dono: 'Raquel', dia: 20 },
    ];

    function App() {
      const [dataAtual, setDataAtual] = useState(() => {
        const now = new Date();
        return { mes: now.getMonth(), ano: now.getFullYear() };
      });

      const [abaAtiva, setAbaAtiva] = useState('inicio');
      const [modalTipo, setModalTipo] = useState(null); // 'gasto' | 'renda_extra' | null

      // Estados Persistidos
      const [gastos, setGastos] = useState(() => {
        const s = localStorage.getItem('jr_fin_gastos');
        return s ? JSON.parse(s) : [];
      });

      const [rendasExtras, setRendasExtras] = useState(() => {
        const s = localStorage.getItem('jr_fin_rendas_extras');
        return s ? JSON.parse(s) : [];
      });

      const [valoresFixasMes, setValoresFixasMes] = useState(() => {
        const s = localStorage.getItem('jr_fin_fixas_mes');
        return s ? JSON.parse(s) : {}; // Chave: "ano-mes-idConta": valor
      });

      const [statusPagamento, setStatusPagamento] = useState(() => {
        const s = localStorage.getItem('jr_fin_pagos');
        return s ? JSON.parse(s) : {};
      });

      // Formulário Novo Gasto
      const [inputRapido, setInputRapido] = useState('');
      const [descGasto, setDescGasto] = useState('');
      const [valorGasto, setValorGasto] = useState('');
      const [respGasto, setRespGasto] = useState('João');
      const [catGasto, setCatGasto] = useState('Mercado');
      const [quinzenaGasto, setQuinzenaGasto] = useState(() => (new Date().getDate() <= 12 ? 5 : 20));
      const [cartaoGasto, setCartaoGasto] = useState('nenhum');
      const [parcelasGasto, setParcelasGasto] = useState(1);

      // Formulário Renda Extra
      const [descExtra, setDescExtra] = useState('Shopee');
      const [valorExtra, setValorExtra] = useState('');
      const [quinzenaExtra, setQuinzenaExtra] = useState(() => (new Date().getDate() <= 12 ? 5 : 20));

      useEffect(() => { localStorage.setItem('jr_fin_gastos', JSON.stringify(gastos)); }, [gastos]);
      useEffect(() => { localStorage.setItem('jr_fin_rendas_extras', JSON.stringify(rendasExtras)); }, [rendasExtras]);
      useEffect(() => { localStorage.setItem('jr_fin_fixas_mes', JSON.stringify(valoresFixasMes)); }, [valoresFixasMes]);
      useEffect(() => { localStorage.setItem('jr_fin_pagos', JSON.stringify(statusPagamento)); }, [statusPagamento]);

      const trocarMes = (dir) => {
        setDataAtual(prev => {
          let novoMes = prev.mes + dir;
          let novoAno = prev.ano;
          if (novoMes > 11) { novoMes = 0; novoAno++; }
          if (novoMes < 0) { novoMes = 11; novoAno--; }
          return { mes: novoMes, ano: novoAno };
        });
      };

      const nomeMes = useMemo(() => {
        const d = new Date(dataAtual.ano, dataAtual.mes, 1);
        return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
      }, [dataAtual]);

      // Parser Inteligente
      const parseTextoRapido = (texto) => {
        setInputRapido(texto);
        if (!texto.trim()) return;
        const limpo = texto.toLowerCase();

        if (limpo.includes('joão') || limpo.includes('joao')) setRespGasto('João');
        else if (limpo.includes('raquel')) setRespGasto('Raquel');
        else if (limpo.includes('casal')) setRespGasto('Casal');

        if (limpo.includes('dia 5') || limpo.includes('quinzena 5')) setQuinzenaGasto(5);
        else if (limpo.includes('dia 20') || limpo.includes('quinzena 20')) setQuinzenaGasto(20);

        if (limpo.includes('ifood') || limpo.includes('lanche') || limpo.includes('pizza') || limpo.includes('delivery')) setCatGasto('Delivery');
        else if (limpo.includes('pedreiro') || limpo.includes('pintor') || limpo.includes('eletricista') || limpo.includes('obra')) setCatGasto('Mão de Obra');
        else if (limpo.includes('apartamento') || limpo.includes('móveis') || limpo.includes('moveis')) setCatGasto('Apartamento');
        else if (limpo.includes('mercado')) setCatGasto('Mercado');
        else if (limpo.includes('gasolina') || limpo.includes('combustivel')) setCatGasto('Combustível');

        const matchValor = texto.match(/(\d+[.,]?\d*)/);
        if (matchValor) setValorGasto(matchValor[0].replace(',', '.'));

        const desc = texto.replace(/joão|joao|raquel|casal|dia 5|dia 20|delivery|ifood|mercado|obra/gi, '').replace(/(\d+[.,]?\d*)/g, '').trim();
        if (desc) setDescGasto(desc.charAt(0).toUpperCase() + desc.slice(1));
      };

      const salvarGasto = () => {
        const numValor = parseFloat(valorGasto);
        if (isNaN(numValor) || numValor <= 0) return;

        const numParcelas = parseInt(parcelasGasto) || 1;
        const valorPorParcela = numValor / numParcelas;
        const baseId = Date.now().toString();
        const novos = [];

        for (let i = 0; i < numParcelas; i++) {
          let m = dataAtual.mes + i;
          let a = dataAtual.ano;
          while (m > 11) { m -= 12; a += 1; }

          novos.push({
            id: `${baseId}_${i}`,
            descricao: numParcelas > 1 ? `${descGasto || catGasto} (${i + 1}/${numParcelas})` : (descGasto || catGasto),
            valor: valorPorParcela,
            responsavel: respGasto,
            categoria: catGasto,
            quinzena: quinzenaGasto,
            cartao: cartaoGasto,
            mes: m,
            ano: a,
            dataRegistro: new Date().toISOString()
          });
        }

        setGastos(prev => [...novos, ...prev]);
        fecharModal();
      };

      const salvarRendaExtra = () => {
        const num = parseFloat(valorExtra);
        if (isNaN(num) || num <= 0) return;

        setRendasExtras(prev => [{
          id: Date.now().toString(),
          descricao: descExtra || 'Shopee',
          valor: num,
          quinzena: quinzenaExtra,
          responsavel: 'João',
          mes: dataAtual.mes,
          ano: dataAtual.ano,
          dataRegistro: new Date().toISOString()
        }, ...prev]);

        fecharModal();
      };

      const fecharModal = () => {
        setModalTipo(null);
        setInputRapido('');
        setDescGasto('');
        setValorGasto('');
        setValorExtra('');
        setDescExtra('Shopee');
        setCartaoGasto('nenhum');
        setParcelasGasto(1);
      };

      const getValorContaFixa = (idConta, valorPadrao) => {
        const chave = `${dataAtual.ano}-${dataAtual.mes}-${idConta}`;
        return valoresFixasMes[chave] !== undefined ? valoresFixasMes[chave] : valorPadrao;
      };

      const atualizarValorContaFixa = (idConta, novoValor) => {
        const chave = `${dataAtual.ano}-${dataAtual.mes}-${idConta}`;
        setValoresFixasMes(prev => ({ ...prev, [chave]: parseFloat(novoValor) || 0 }));
      };

      const toggleStatus = (id) => {
        const chave = `${dataAtual.ano}-${dataAtual.mes}-${id}`;
        setStatusPagamento(prev => ({ ...prev, [chave]: !prev[chave] }));
      };

      // Cálculos do Mês
      const gastosMes = useMemo(() => gastos.filter(g => g.mes === dataAtual.mes && g.ano === dataAtual.ano), [gastos, dataAtual]);
      const extrasMes = useMemo(() => rendasExtras.filter(r => r.mes === dataAtual.mes && r.ano === dataAtual.ano), [rendasExtras, dataAtual]);

      const metricas = useMemo(() => {
        // ENTRADAS
        const salariosD5 = 2300;
        const salariosD20 = 2000;
        const extraD5 = extrasMes.filter(e => e.quinzena === 5).reduce((a, b) => a + b.valor, 0);
        const extraD20 = extrasMes.filter(e => e.quinzena === 20).reduce((a, b) => a + b.valor, 0);

        const totalEntradasD5 = salariosD5 + extraD5;
        const totalEntradasD20 = salariosD20 + extraD20;
        const totalEntradasMes = totalEntradasD5 + totalEntradasD20;

        // CONTAS FIXAS
        const fixaInternet = getValorContaFixa('f_internet', 120);
        const fixaAluguel = getValorContaFixa('f_aluguel', 1500);
        const fixaLuz = getValorContaFixa('f_luz', 180);
        const fixaAgua = getValorContaFixa('f_agua', 80);

        const totalFixasD5 = fixaInternet;
        const totalFixasD20 = fixaAluguel + fixaLuz + fixaAgua;

        // CARTÕES
        const cartoesD5 = gastosMes.filter(g => g.cartao === 'j5' || g.cartao === 'r5').reduce((a, b) => a + b.valor, 0);
        const cartoesD20 = gastosMes.filter(g => g.cartao === 'j20' || g.cartao === 'r20').reduce((a, b) => a + b.valor, 0);

        // GASTOS AVULSOS
        const avulsosD5 = gastosMes.filter(g => g.quinzena === 5 && g.cartao === 'nenhum').reduce((a, b) => a + b.valor, 0);
        const avulsosD20 = gastosMes.filter(g => g.quinzena === 20 && g.cartao === 'nenhum').reduce((a, b) => a + b.valor, 0);

        // TOTAIS DE SAÍDA POR QUINZENA
        const totalSaidasD5 = totalFixasD5 + cartoesD5 + avulsosD5;
        const totalSaidasD20 = totalFixasD20 + cartoesD20 + avulsosD20;
        const totalSaidasGeral = totalSaidasD5 + totalSaidasD20;

        // DISPONÍVEL
        const disponivelD5 = totalEntradasD5 - totalSaidasD5;
        const disponivelD20 = totalEntradasD20 - totalSaidasD20;
        const disponivelTotal = disponivelD5 + disponivelD20;

        // DELIVERY
        const deliveryGastos = gastosMes.filter(g => g.categoria === 'Delivery');
        const deliveryTotal = deliveryGastos.reduce((a, b) => a + b.valor, 0);
        const deliveryCount = deliveryGastos.length;
        const deliveryJoao = deliveryGastos.filter(g => g.responsavel === 'João').reduce((a, b) => a + b.valor, 0);
        const deliveryRaquel = deliveryGastos.filter(g => g.responsavel === 'Raquel').reduce((a, b) => a + b.valor, 0);

        // APARTAMENTO & MÃO DE OBRA
        const apAvulsoMes = gastosMes.filter(g => g.categoria === 'Apartamento').reduce((a, b) => a + b.valor, 0);
        const apTotalMes = totalFixasD5 + totalFixasD20 + apAvulsoMes;
        const maoObraMes = gastosMes.filter(g => g.categoria === 'Mão de Obra').reduce((a, b) => a + b.valor, 0);

        const apTotalHistorico = gastos.filter(g => g.categoria === 'Apartamento').reduce((a, b) => a + b.valor, 0)
          + (CONTAS_FIXAS_BASE.reduce((a, b) => a + b.valorPadrao, 0) * (gastos.length > 0 ? 1 : 1));

        return {
          totalEntradasMes,
          totalSaidasGeral,
          disponivelTotal,
          totalEntradasD5,
          totalSaidasD5,
          disponivelD5,
          totalEntradasD20,
          totalSaidasD20,
          disponivelD20,
          extraTotal: extraD5 + extraD20,
          totalFixasMes: totalFixasD5 + totalFixasD20,
          totalCartoesMes: cartoesD5 + cartoesD20,
          deliveryTotal,
          deliveryCount,
          deliveryJoao,
          deliveryRaquel,
          apTotalMes,
          apTotalHistorico,
          maoObraMes,
          fixaInternet,
          fixaAluguel,
          fixaLuz,
          fixaAgua
        };
      }, [gastosMes, extrasMes, valoresFixasMes, gastos]);

      return (
        <div className="flex flex-col flex-1">
          {/* TOPO: SELETOR DE MÊS */}
          <header className="bg-slate-900 text-white p-4 pt-6 sticky top-0 z-30 shadow-md flex items-center justify-between">
            <button onClick={() => trocarMes(-1)} className="p-2 rounded-full hover:bg-slate-800 text-lg font-bold">←</button>
            <div className="text-center">
              <span className="text-[10px] tracking-widest text-slate-400 font-bold block">CONTROLE QUINZENAL</span>
              <h1 className="text-sm font-extrabold">{nomeMes}</h1>
            </div>
            <button onClick={() => trocarMes(1)} className="p-2 rounded-full hover:bg-slate-800 text-lg font-bold">→</button>
          </header>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="p-4 flex-1 space-y-4">
            {/* --- ABA INÍCIO --- */}
            {abaAtiva === 'inicio' && (
              <div className="space-y-4">
                {/* BOTÕES DE ENTRADA RÁPIDA */}
                <div className="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => { setModalTipo('gasto'); setQuinzenaGasto(5); }}
                    className="bg-emerald-500 active:bg-emerald-600 text-white font-extrabold py-3.5 px-3 rounded-2xl shadow-md flex items-center justify-center space-x-1.5"
                  >
                    <span className="text-xl">+</span>
                    <span className="text-sm">NOVO GASTO</span>
                  </button>
                  <button 
                    onClick={() => setModalTipo('renda_extra')}
                    className="bg-amber-500 active:bg-amber-600 text-white font-extrabold py-3.5 px-3 rounded-2xl shadow-md flex items-center justify-center space-x-1.5"
                  >
                    <span className="text-xl">💰</span>
                    <span className="text-sm">RENDA EXTRA</span>
                  </button>
                </div>

                {/* CARD DISPONÍVEL TOTAL */}
                <div className="bg-slate-900 text-white rounded-3xl p-5 shadow-lg relative overflow-hidden">
                  <span className="text-xs font-bold text-slate-400">DINHEIRO DISPONÍVEL (MÊS)</span>
                  <div className={`text-3xl font-black mt-1 ${metricas.disponivelTotal < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                    R$ {metricas.disponivelTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                  </div>
                  <div className="flex justify-between text-xs text-slate-400 mt-4 pt-3 border-t border-slate-800">
                    <span>Entradas: <strong className="text-white">R$ {metricas.totalEntradasMes.toFixed(2)}</strong></span>
                    <span>Saídas: <strong className="text-white">R$ {metricas.totalSaidasGeral.toFixed(2)}</strong></span>
                  </div>
                </div>

                {/* DIVISÃO DAS QUINZENAS */}
                <div className="grid grid-cols-2 gap-3">
                  {/* QUINZENA DIA 5 */}
                  <div className={`p-4 rounded-2xl border ${metricas.disponivelD5 < 0 ? 'bg-rose-50 border-rose-200' : 'bg-white border-slate-200'} shadow-sm`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-black text-slate-500">DIA 5</span>
                      {metricas.disponivelD5 < 0 && <span className="text-[10px] font-black text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded">NEGATIVO</span>}
                    </div>
                    <span className="text-[10px] text-slate-400 block">Disponível</span>
                    <div className={`text-lg font-black ${metricas.disponivelD5 < 0 ? 'text-rose-600' : 'text-slate-900'}`}>
                      R$ {metricas.disponivelD5.toFixed(2)}
                    </div>
                    <div className="mt-2 text-[10px] text-slate-500 pt-2 border-t border-slate-100 space-y-0.5">
                      <div>Entrou: R$ {metricas.totalEntradasD5.toFixed(0)}</div>
                      <div>Saiu: R$ {metricas.totalSaidasD5.toFixed(0)}</div>
                    </div>
                  </div>

                  {/* QUINZENA DIA 20 */}
                  <div className={`p-4 rounded-2xl border ${metricas.disponivelD20 < 0 ? 'bg-rose-50 border-rose-200' : 'bg-white border-slate-200'} shadow-sm`}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-xs font-black text-slate-500">DIA 20</span>
                      {metricas.disponivelD20 < 0 && <span className="text-[10px] font-black text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded">NEGATIVO</span>}
                    </div>
                    <span className="text-[10px] text-slate-400 block">Disponível</span>
                    <div className={`text-lg font-black ${metricas.disponivelD20 < 0 ? 'text-rose-600' : 'text-slate-900'}`}>
                      R$ {metricas.disponivelD20.toFixed(2)}
                    </div>
                    <div className="mt-2 text-[10px] text-slate-500 pt-2 border-t border-slate-100 space-y-0.5">
                      <div>Entrou: R$ {metricas.totalEntradasD20.toFixed(0)}</div>
                      <div>Saiu: R$ {metricas.totalSaidasD20.toFixed(0)}</div>
                    </div>
                  </div>
                </div>

                {/* ALERTAS DE QUINZENA */}
                {metricas.disponivelD5 > 0 && metricas.disponivelD5 <= 400 && (
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs font-semibold text-amber-800 flex items-center gap-2">
                    <span>⚠️</span>
                    <span>Atenção: Restam apenas R$ {metricas.disponivelD5.toFixed(2)} na quinzena do Dia 5.</span>
                  </div>
                )}
                {metricas.disponivelD20 > 0 && metricas.disponivelD20 <= 400 && (
                  <div className="bg-amber-50 border border-amber-200 p-3 rounded-2xl text-xs font-semibold text-amber-800 flex items-center gap-2">
                    <span>⚠️</span>
                    <span>Atenção: Restam apenas R$ {metricas.disponivelD20.toFixed(2)} na quinzena do Dia 20.</span>
                  </div>
                )}

                {/* RESUMO RÁPIDO: DELIVERY & APARTAMENTO */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-xl block mb-1">🍔</span>
                    <span className="text-xs font-bold text-slate-400 block">DELIVERY</span>
                    <span className="text-base font-extrabold text-slate-800">R$ {metricas.deliveryTotal.toFixed(2)}</span>
                    <span className="text-[10px] text-slate-400 block mt-0.5">{metricas.deliveryCount} pedidos</span>
                  </div>

                  <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <span className="text-xl block mb-1">🏠</span>
                    <span className="text-xs font-bold text-slate-400 block">APARTAMENTO</span>
                    <span className="text-base font-extrabold text-slate-800">R$ {metricas.apTotalMes.toFixed(2)}</span>
                    <span className="text-[10px] text-slate-400 block mt-0.5">+ Mão de Obra: R$ {metricas.maoObraMes.toFixed(0)}</span>
                  </div>
                </div>
              </div>
            )}

            {/* --- ABA GASTOS & HISTÓRICO --- */}
            {abaAtiva === 'gastos' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-black text-slate-400 mb-3 tracking-wider">RESUMO DO CASAL</h2>
                  <div className="space-y-2 text-xs">
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="font-semibold text-slate-600">Salários Fixos</span>
                      <span className="font-bold text-slate-800">R$ 4.300,00</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="font-semibold text-slate-600">Renda Extra (Shopee)</span>
                      <span className="font-bold text-emerald-600">+ R$ {metricas.extraTotal.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="font-semibold text-slate-600">Contas Fixas</span>
                      <span className="font-bold text-rose-500">- R$ {metricas.totalFixasMes.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="font-semibold text-slate-600">Cartões</span>
                      <span className="font-bold text-rose-500">- R$ {metricas.totalCartoesMes.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-100">
                      <span className="font-semibold text-slate-600">Apartamento & Reforma</span>
                      <span className="font-bold text-rose-500">- R$ {(metricas.apTotalMes + metricas.maoObraMes).toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between py-1.5 font-bold text-sm">
                      <span className="text-slate-800">SOBRA TOTAL:</span>
                      <span className={metricas.disponivelTotal < 0 ? 'text-rose-600' : 'text-emerald-600'}>
                        R$ {metricas.disponivelTotal.toFixed(2)}
                      </span>
                    </div>
                  </div>
                </div>

                {/* HISTÓRICO DE LANÇAMENTOS */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-black text-slate-400 mb-3 tracking-wider">HISTÓRICO DO MÊS</h2>
                  {gastosMes.length === 0 ? (
                    <span className="text-xs text-slate-400 italic">Nenhum gasto avulso registrado.</span>
                  ) : (
                    <div className="space-y-2">
                      {gastosMes.map(g => (
                        <div key={g.id} className="flex items-center justify-between p-2 rounded-xl bg-slate-50 border border-slate-100">
                          <div>
                            <span className="text-xs font-bold text-slate-800 block">{g.descricao}</span>
                            <span className="text-[10px] text-slate-400">{g.responsavel} • {g.categoria} • Dia {g.quinzena}</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <span className="text-xs font-black text-slate-800">R$ {g.valor.toFixed(2)}</span>
                            <button 
                              onClick={() => setGastos(prev => prev.filter(item => item.id !== g.id))}
                              className="text-slate-300 hover:text-rose-500 font-bold text-xs p-1"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* --- ABA CONTAS (DIA 5 & DIA 20) --- */}
            {abaAtiva === 'contas' && (
              <div className="space-y-4">
                {/* BLOCO DIA 5 */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center pb-2 mb-3 border-b border-slate-100">
                    <div>
                      <span className="text-sm font-black text-slate-800 block">QUINZENA DIA 5</span>
                      <span className="text-[10px] text-slate-400">Salários: R$ 2.300 (João 1.150 + Raquel 1.150)</span>
                    </div>
                    <span className="text-xs font-extrabold text-slate-700">R$ {metricas.totalSaidasD5.toFixed(2)}</span>
                  </div>

                  <div className="space-y-2.5">
                    {/* Internet */}
                    <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('f_internet')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-f_internet`] ? '🟢' : '🔴'}
                        </span>
                        <span className="text-xs font-bold text-slate-700">Internet</span>
                      </div>
                      <input 
                        type="number" 
                        value={metricas.fixaInternet}
                        onChange={(e) => atualizarValorContaFixa('f_internet', e.target.value)}
                        className="w-20 bg-white border border-slate-200 rounded-lg p-1 text-right text-xs font-bold"
                      />
                    </div>

                    {/* Cartões Dia 5 */}
                    <div className="flex items-center justify-between p-2 text-xs">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('cartao5')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-cartao5`] ? '🟢' : '🔴'}
                        </span>
                        <span className="font-semibold text-slate-600">Faturas Cartões (Dia 5)</span>
                      </div>
                      <span className="font-bold text-slate-800">
                        R$ {gastosMes.filter(g => g.cartao === 'j5' || g.cartao === 'r5').reduce((a, b) => a + b.valor, 0).toFixed(2)}
                      </span>
                    </div>
                  </div>
                </div>

                {/* BLOCO DIA 20 */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center pb-2 mb-3 border-b border-slate-100">
                    <div>
                      <span className="text-sm font-black text-slate-800 block">QUINZENA DIA 20</span>
                      <span className="text-[10px] text-slate-400">Salários: R$ 2.000 (João 1.000 + Raquel 1.000)</span>
                    </div>
                    <span className="text-xs font-extrabold text-slate-700">R$ {metricas.totalSaidasD20.toFixed(2)}</span>
                  </div>

                  <div className="space-y-2.5">
                    {/* Aluguel */}
                    <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('f_aluguel')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-f_aluguel`] ? '🟢' : '🔴'}
                        </span>
                        <span className="text-xs font-bold text-slate-700">Aluguel</span>
                      </div>
                      <input 
                        type="number" 
                        value={metricas.fixaAluguel}
                        onChange={(e) => atualizarValorContaFixa('f_aluguel', e.target.value)}
                        className="w-20 bg-white border border-slate-200 rounded-lg p-1 text-right text-xs font-bold"
                      />
                    </div>

                    {/* Luz */}
                    <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('f_luz')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-f_luz`] ? '🟢' : '🔴'}
                        </span>
                        <span className="text-xs font-bold text-slate-700">Luz</span>
                      </div>
                      <input 
                        type="number" 
                        value={metricas.fixaLuz}
                        onChange={(e) => atualizarValorContaFixa('f_luz', e.target.value)}
                        className="w-20 bg-white border border-slate-200 rounded-lg p-1 text-right text-xs font-bold"
                      />
                    </div>

                    {/* Água */}
                    <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-xl">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('f_agua')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-f_agua`] ? '🟢' : '🔴'}
                        </span>
                        <span className="text-xs font-bold text-slate-700">Água</span>
                      </div>
                      <input 
                        type="number" 
                        value={metricas.fixaAgua}
                        onChange={(e) => atualizarValorContaFixa('f_agua', e.target.value)}
                        className="w-20 bg-white border border-slate-200 rounded-lg p-1 text-right text-xs font-bold"
                      />
                    </div>

                    {/* Cartões Dia 20 */}
                    <div className="flex items-center justify-between p-2 text-xs">
                      <div className="flex items-center space-x-2">
                        <span onClick={() => toggleStatus('cartao20')} className="cursor-pointer">
                          {statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-cartao20`] ? '🟢' : '🔴'}
                        </span>
                        <span className="font-semibold text-slate-600">Faturas Cartões (Dia 20)</span>
                      </div>
                      <span className="font-bold text-slate-800">
                        R$ {gastosMes.filter(g => g.cartao === 'j20' || g.cartao === 'r20').reduce((a, b) => a + b.valor, 0).toFixed(2)}
                      </span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- ABA MAIS / APARTAMENTO & EXTRAS --- */}
            {abaAtiva === 'mais' && (
              <div className="space-y-4">
                {/* PAINEL APARTAMENTO */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-black text-slate-400 mb-2 tracking-wider">🏠 CONTROLE DO APARTAMENTO</h2>
                  <div className="grid grid-cols-2 gap-2 my-3">
                    <div className="bg-slate-50 p-3 rounded-xl">
                      <span className="text-[10px] text-slate-400 block font-bold">ESTE MÊS</span>
                      <span className="text-sm font-black text-slate-800">R$ {metricas.apTotalMes.toFixed(2)}</span>
                    </div>
                    <div className="bg-slate-50 p-3 rounded-xl">
                      <span className="text-[10px] text-slate-400 block font-bold">HISTÓRICO TOTAL</span>
                      <span className="text-sm font-black text-slate-800">R$ {metricas.apTotalHistorico.toFixed(2)}</span>
                    </div>
                  </div>

                  <div className="text-xs space-y-1 pt-2 border-t border-slate-100">
                    <div className="flex justify-between py-0.5">
                      <span className="text-slate-500">Mão de Obra (Mês):</span>
                      <span className="font-bold text-slate-800">R$ {metricas.maoObraMes.toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                {/* HISTÓRICO DE RENDA EXTRA */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-black text-slate-400 mb-2 tracking-wider">💰 RENDAS EXTRAS DO MÊS</h2>
                  {extrasMes.length === 0 ? (
                    <span className="text-xs text-slate-400 italic">Nenhuma renda extra adicionada.</span>
                  ) : (
                    <div className="space-y-2">
                      {extrasMes.map(r => (
                        <div key={r.id} className="flex justify-between items-center p-2 rounded-xl bg-amber-50/50 border border-amber-100">
                          <div>
                            <span className="text-xs font-bold text-amber-900 block">{r.descricao}</span>
                            <span className="text-[10px] text-amber-700">Dia {r.quinzena} • {r.responsavel}</span>
                          </div>
                          <div className="flex items-center space-x-2">
                            <span className="text-xs font-black text-emerald-700">+ R$ {r.valor.toFixed(2)}</span>
                            <button 
                              onClick={() => setRendasExtras(prev => prev.filter(item => item.id !== r.id))}
                              className="text-slate-300 hover:text-rose-500 font-bold text-xs"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* MODAL NOVO GASTO */}
          {modalTipo === 'gasto' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-base font-black text-slate-800">+ Adicionar Gasto</h2>
                  <button onClick={fecharModal} className="text-slate-400 text-xl font-bold">✕</button>
                </div>

                <div className="space-y-4">
                  {/* Atalho WhatsApp */}
                  <div>
                    <input 
                      type="text" 
                      placeholder='Ex: "Mercado 150 João dia 5"' 
                      value={inputRapido}
                      onChange={(e) => parseTextoRapido(e.target.value)}
                      className="w-full bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                    />
                  </div>

                  {/* Descrição & Valor */}
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 block mb-1">O QUE GASTOU?</label>
                      <input 
                        type="text" 
                        placeholder="Ex: Mercado" 
                        value={descGasto}
                        onChange={(e) => setDescGasto(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold text-slate-400 block mb-1">VALOR (R$)</label>
                      <input 
                        type="number" 
                        step="0.01" 
                        placeholder="0,00" 
                        value={valorGasto}
                        onChange={(e) => setValorGasto(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-black text-slate-800"
                      />
                    </div>
                  </div>

                  {/* Quinzena de Débito */}
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">DE QUAL QUINZENA VAI SAIR?</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={() => setQuinzenaGasto(5)}
                        className={`py-2 rounded-xl text-xs font-bold border ${quinzenaGasto === 5 ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}`}
                      >
                        📅 Quinzena Dia 5
                      </button>
                      <button 
                        onClick={() => setQuinzenaGasto(20)}
                        className={`py-2 rounded-xl text-xs font-bold border ${quinzenaGasto === 20 ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}`}
                      >
                        📅 Quinzena Dia 20
                      </button>
                    </div>
                  </div>

                  {/* Quem Gastou */}
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">QUEM GASTOU?</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['João', 'Raquel', 'Casal'].map(p => (
                        <button 
                          key={p}
                          onClick={() => setRespGasto(p)}
                          className={`py-2 rounded-xl text-xs font-bold border ${respGasto === p ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-600 border-slate-200'}`}
                        >
                          {p}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Categoria */}
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">CATEGORIA</label>
                    <div className="grid grid-cols-3 gap-1.5">
                      {CATEGORIAS.map(c => (
                        <button 
                          key={c.id}
                          onClick={() => setCatGasto(c.id)}
                          className={`py-2 px-1 rounded-xl text-[11px] font-bold border flex items-center justify-center space-x-1 ${catGasto === c.id ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-slate-600 border-slate-200'}`}
                        >
                          <span>{c.icon}</span>
                          <span className="truncate">{c.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Cartão e Parcelas */}
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">PAGAMENTO / CARTÃO</label>
                    <select 
                      value={cartaoGasto} 
                      onChange={(e) => setCartaoGasto(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold mb-2"
                    >
                      {CARTAO_OPCOES.map(opt => (
                        <option key={opt.id} value={opt.id}>{opt.label}</option>
                      ))}
                    </select>

                    {cartaoGasto !== 'nenhum' && (
                      <div className="flex items-center space-x-2">
                        <label className="text-xs font-bold text-slate-400">Parcelas:</label>
                        <select 
                          value={parcelasGasto} 
                          onChange={(e) => setParcelasGasto(e.target.value)}
                          className="bg-slate-50 border border-slate-200 rounded-xl p-1.5 text-xs font-bold"
                        >
                          {[1, 2, 3, 4, 5, 6, 10, 12].map(n => (
                            <option key={n} value={n}>{n}x</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  <button 
                    onClick={salvarGasto}
                    className="w-full bg-emerald-500 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg mt-2 active:bg-emerald-600"
                  >
                    SALVAR GASTO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL RENDA EXTRA */}
          {modalTipo === 'renda_extra' && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-base font-black text-slate-800">💰 Adicionar Renda Extra</h2>
                  <button onClick={fecharModal} className="text-slate-400 text-xl font-bold">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">ORIGEM / DESCRIÇÃO</label>
                    <input 
                      type="text" 
                      value={descExtra} 
                      onChange={(e) => setDescExtra(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-semibold"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">VALOR RECEBIDO (R$)</label>
                    <input 
                      type="number" 
                      step="0.01" 
                      placeholder="Ex: 180,00" 
                      value={valorExtra}
                      onChange={(e) => setValorExtra(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-lg font-black text-slate-800"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-slate-400 block mb-1">ENTROU EM QUAL QUINZENA?</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button 
                        onClick={() => setQuinzenaExtra(5)}
                        className={`py-2 rounded-xl text-xs font-bold border ${quinzenaExtra === 5 ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-200'}`}
                      >
                        Dia 5
                      </button>
                      <button 
                        onClick={() => setQuinzenaExtra(20)}
                        className={`py-2 rounded-xl text-xs font-bold border ${quinzenaExtra === 20 ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-slate-600 border-slate-200'}`}
                      >
                        Dia 20
                      </button>
                    </div>
                  </div>

                  <button 
                    onClick={salvarRendaExtra}
                    className="w-full bg-amber-500 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-lg mt-2 active:bg-amber-600"
                  >
                    SOMAR AO SALDO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MENU INFERIOR FIXO */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-4 py-2 flex justify-between items-center z-40">
            <button 
              onClick={() => setAbaAtiva('inicio')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'inicio' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">🏠</span>
              <span className="text-[10px]">Início</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('gastos')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'gastos' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">💸</span>
              <span className="text-[10px]">Gastos</span>
            </button>
            <button 
              onClick={() => { setModalTipo('gasto'); setQuinzenaGasto(5); }} 
              className="bg-emerald-500 text-white rounded-full p-3 shadow-lg -translate-y-3 flex items-center justify-center border-4 border-slate-50"
            >
              <span className="text-2xl font-bold leading-none">➕</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('contas')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'contas' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">📅</span>
              <span className="text-[10px]">Contas</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('mais')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'mais' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">☰</span>
              <span className="text-[10px]">Mais</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
