<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RouteFlow — Otimização & Navegação</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-sidebar: #070A0F;
      --bg-card: #121824;
      --bg-card-hover: #182232;
      --border-color: #1F293D;
      --accent-primary: #00E599;
      --accent-secondary: #00A3FF;
      --accent-warning: #FFB800;
      --accent-danger: #FF4D4D;
      --accent-success: #00E599;
      --accent-purple: #8A2BE2;
      --text-main: #F0F4F8;
      --text-muted: #8E9BAE;
      --text-subtle: #4D5B6F;
      --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --sidebar-width: 250px;
      --header-height: 64px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Correções de Renderização do Leaflet */
    .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      background: #090D14 !important;
      z-index: 1;
    }

    .leaflet-pane { z-index: 2 !important; }
    .leaflet-top, .leaflet-bottom { z-index: 3 !important; }

    .app-wrapper {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .app-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 100;
      transition: all 0.3s ease;
    }

    .sidebar-header {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: rgba(0, 229, 153, 0.15);
      border: 1px solid var(--accent-primary);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-primary);
      font-size: 1.1rem;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-name span { color: var(--accent-primary); }

    .sidebar-nav {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }

    .nav-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 10px 0 4px 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.88rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .nav-item i { width: 18px; text-align: center; }

    .nav-item:hover {
      background: var(--bg-card);
      color: var(--text-main);
    }

    .nav-item.active {
      background: rgba(0, 229, 153, 0.12);
      border: 1px solid rgba(0, 229, 153, 0.3);
      color: var(--accent-primary);
      font-weight: 600;
    }

    .nav-badge {
      margin-left: auto;
      background: var(--accent-primary);
      color: #000;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
    }

    /* MAIN CONTAINER */
    .app-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      height: var(--header-height);
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 50;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-subtle);
    }

    .status-dot.active {
      background: var(--accent-primary);
      box-shadow: 0 0 8px var(--accent-primary);
    }

    .status-dot.searching {
      background: var(--accent-warning);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent-primary);
      color: #050B08;
    }

    .btn-primary:hover { background: #02ffab; }

    .btn-secondary {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover { background: var(--bg-card-hover); }

    .btn-accent-blue {
      background: var(--accent-secondary);
      color: #fff;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.78rem;
    }

    /* VIEWPORT */
    .app-viewport {
      flex: 1;
      height: calc(100vh - var(--header-height));
      position: relative;
      overflow: hidden;
    }

    .view-page {
      position: absolute;
      inset: 0;
      display: none;
      height: 100%;
      width: 100%;
    }

    .view-page.active { display: flex; }

    /* VIEW: OPTIMIZER & MAP (LAYOUT 40/60) */
    #view-optimizer {
      display: flex;
      flex-direction: row;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    .route-panel {
      width: 380px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      flex-shrink: 0;
      z-index: 10;
    }

    .route-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 0.78rem;
    }

    .stat-box { display: flex; flex-direction: column; }
    .stat-label { color: var(--text-subtle); font-size: 0.7rem; font-weight: 600; }
    .stat-val { font-weight: 700; font-size: 1rem; color: #fff; font-family: var(--font-mono); }
    .stat-val.highlight { color: var(--accent-primary); }

    .route-stops-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stop-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: grab;
    }

    .stop-card:hover { border-color: var(--accent-primary); }

    .stop-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #1C2638;
      color: var(--accent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: var(--font-mono);
      flex-shrink: 0;
    }

    .stop-info { flex: 1; overflow: hidden; }
    .stop-name { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .stop-addr { font-size: 0.75rem; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: #090D14;
    }

    #route-map, #nav-map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
    }

    /* VIEW: HUD NAVEGAÇÃO */
    #view-navigation {
      position: relative;
      height: 100%;
      width: 100%;
    }

    .nav-hud-top {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: rgba(11, 15, 23, 0.95);
      border: 1px solid var(--accent-primary);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-soft);
    }

    .nav-hud-bottom {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 500px;
      background: rgba(11, 15, 23, 0.95);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
    }

    /* PINS PERSONALIZADOS */
    .custom-marker {
      background: #070A0F;
      border: 2px solid var(--accent-primary);
      color: var(--accent-primary);
      border-radius: 50%;
      font-weight: 800;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .custom-marker.start {
      border-color: var(--accent-secondary);
      color: var(--accent-secondary);
    }

    .gps-user-pulse {
      width: 16px;
      height: 16px;
      background: var(--accent-secondary);
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 14px var(--accent-secondary);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 500px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
    .form-control {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    .form-control:focus { border-color: var(--accent-primary); }

    /* TOAST */
    #toast-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--accent-primary);
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      color: #fff;
      box-shadow: var(--shadow-soft);
    }

    @media (max-width: 850px) {
      .app-sidebar {
        position: fixed;
        left: -100%;
        top: 0;
        bottom: 0;
      }
      .app-sidebar.open { left: 0; }
      .btn-mobile-toggle { display: block; }
      #view-optimizer { flex-direction: column-reverse; }
      .route-panel { width: 100%; height: 50%; }
      .map-container { height: 50%; }
    }
  </style>
</head>
<body>

  <div id="toast-box"></div>

  <div class="app-wrapper">

    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon"><i class="fa-solid fa-diamond-turn-right"></i></div>
        <div class="brand-name">ROUTE<span>FLOW</span></div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-label">Módulos</div>
        <a class="nav-item active" data-view="view-optimizer">
          <i class="fa-solid fa-route"></i>
          <span>Otimizador & Mapa</span>
          <span class="nav-badge" id="badge-stops-count">0</span>
        </a>
        <a class="nav-item" id="btn-menu-import">
          <i class="fa-solid fa-file-excel"></i>
          <span>Importar XLSX</span>
        </a>
        <a class="nav-item" data-view="view-navigation" id="btn-menu-nav">
          <i class="fa-solid fa-location-arrow"></i>
          <span>Navegação GPS</span>
        </a>
      </nav>
    </aside>

    <main class="app-main">
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="btn-mobile-toggle" id="btn-toggle-menu"><i class="fa-solid fa-bars"></i></button>
          <div class="status-badge">
            <div class="status-dot searching" id="gps-status-dot"></div>
            <span id="gps-status-label">Obtendo GPS Real...</span>
          </div>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" id="btn-force-gps" title="Atualizar minha posição GPS">
            <i class="fa-solid fa-crosshairs"></i> Minha Posição
          </button>
          <button class="btn btn-primary btn-sm" id="btn-open-import">
            <i class="fa-solid fa-cloud-arrow-up"></i> Importar XLSX
          </button>
        </div>
      </header>

      <div class="app-viewport">

        <div class="view-page active" id="view-optimizer">
          
          <div class="route-panel">
            <div class="route-panel-header">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="color: #fff; font-size: 0.95rem;">Sequência de Entrega</strong>
                <button class="btn btn-secondary btn-sm" id="btn-open-cfg"><i class="fa-solid fa-gear"></i></button>
              </div>

              <div class="stats-card">
                <div class="stat-box">
                  <span class="stat-label">Distância Total</span>
                  <span class="stat-val highlight" id="stat-dist">0.0 km</span>
                </div>
                <div class="stat-box">
                  <span class="stat-label">Tempo Estimado</span>
                  <span class="stat-val" id="stat-time">0 min</span>
                </div>
              </div>

              <div style="display: flex; gap: 6px;">
                <button class="btn btn-primary btn-sm" id="btn-exec-optimize" style="flex: 1;">
                  <i class="fa-solid fa-wand-magic-sparkles"></i> Otimizar
                </button>
                <button class="btn btn-accent-blue btn-sm" id="btn-start-nav">
                  <i class="fa-solid fa-location-arrow"></i> Navegar
                </button>
                <button class="btn btn-secondary btn-sm" id="btn-gen-pdf">
                  <i class="fa-solid fa-file-pdf"></i> PDF
                </button>
              </div>
            </div>

            <div class="route-stops-container" id="stops-list-box"></div>

            <div style="padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 6px;">
              <button class="btn btn-secondary btn-sm" style="flex: 1;" id="btn-add-stop-manual">
                <i class="fa-solid fa-plus"></i> Adicionar Ponto
              </button>
            </div>
          </div>

          <div class="map-container">
            <div id="route-map"></div>
          </div>

        </div>

        <div class="view-page" id="view-navigation">
          <div class="nav-hud-top">
            <i class="fa-solid fa-diamond-turn-right" style="font-size: 1.6rem; color: var(--accent-primary);"></i>
            <div style="flex: 1; overflow: hidden;">
              <div style="font-weight: 800; color: #fff; font-size: 0.95rem;" id="nav-target-name">Destino Próximo</div>
              <div style="font-size: 0.78rem; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap;" id="nav-target-addr">-</div>
            </div>
          </div>

          <div id="nav-map"></div>

          <div class="nav-hud-bottom">
            <div>
              <div style="font-size: 0.7rem; color: var(--text-subtle);">RESTANTE</div>
              <div style="font-size: 1.1rem; font-weight: 800; color: #fff;" id="nav-rem-dist">0.0 km</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-primary btn-sm" id="btn-nav-complete"><i class="fa-solid fa-check"></i> Concluir</button>
              <button class="btn btn-secondary btn-sm" id="btn-nav-exit"><i class="fa-solid fa-xmark"></i> Sair</button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="modal-import">
    <div class="modal-box">
      <h3 style="color: #fff; font-size: 1rem;"><i class="fa-solid fa-file-excel" style="color: var(--accent-primary);"></i> Carregar Planilha XLSX</h3>
      <input type="file" id="xlsx-file-input" accept=".xlsx, .xls" class="form-control" />
      <div id="import-msg" style="font-size: 0.8rem; color: var(--text-muted);">Selecione uma planilha contendo colunas com endereços.</div>
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
        <button class="btn btn-secondary btn-sm" id="btn-close-import">Cancelar</button>
        <button class="btn btn-primary btn-sm" id="btn-confirm-import" disabled>Processar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-cfg">
    <div class="modal-box">
      <h3 style="color: #fff; font-size: 1rem;"><i class="fa-solid fa-sliders"></i> Configurar Rota</h3>
      <div class="form-group">
        <label>Ponto de Partida</label>
        <div style="display: flex; gap: 6px;">
          <input type="text" class="form-control" id="cfg-start-addr" style="flex: 1;" placeholder="Buscando GPS..." />
          <button class="btn btn-secondary btn-sm" id="btn-cfg-use-gps" title="Usar minha localização exata"><i class="fa-solid fa-crosshairs"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Retornar ao ponto inicial ao final?</label>
        <select class="form-control" id="cfg-return-start">
          <option value="false">Não (Terminar na última parada)</option>
          <option value="true">Sim (Rota Circular)</option>
        </select>
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary btn-sm" id="btn-close-cfg">Fechar</button>
        <button class="btn btn-primary btn-sm" id="btn-save-cfg">Salvar</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-add-stop">
    <div class="modal-box">
      <h3 style="color: #fff; font-size: 1rem;"><i class="fa-solid fa-location-dot"></i> Adicionar Ponto</h3>
      <div class="form-group">
        <label>Nome / Identificador</label>
        <input type="text" class="form-control" id="add-stop-name" placeholder="Ex: Entrega #1" />
      </div>
      <div class="form-group">
        <label>Endereço Completo</label>
        <input type="text" class="form-control" id="add-stop-addr" placeholder="Ex: Av. Paulista, 1000, São Paulo" />
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn btn-secondary btn-sm" id="btn-close-add">Cancelar</button>
        <button class="btn btn-primary btn-sm" id="btn-save-add">Adicionar</button>
      </div>
    </div>
  </div>

  <script>
    // ESTADO CENTRAL
    const State = {
      userLocation: null, // [lat, lng] exato via GPS
      startAddress: 'Obtendo localização...',
      startCoords: null,
      returnToStart: false,
      stops: [],
      routePolyline: null,
      navIndex: 0
    };

    let map = null;
    let navMap = null;
    let markersLayer = null;
    let userMarker = null;

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      initMaps();
      initRealGPS();
      bindEvents();
      setupSortable();
    });

    // CORREÇÃO DO MAPA LEAFLET
    function initMaps() {
      // Posição inicial neutra até o GPS responder
      const defaultCoord = [-23.55052, -46.633308];

      map = L.map('route-map', {
        zoomControl: true,
        attributionControl: false
      }).setView(defaultCoord, 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(map);

      markersLayer = L.featureGroup().addTo(map);

      navMap = L.map('nav-map', {
        zoomControl: false,
        attributionControl: false
      }).setView(defaultCoord, 16);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19
      }).addTo(navMap);

      // Garante redimensionamento sem bugs de blocos cinzas
      setTimeout(() => {
        map.invalidateSize();
        navMap.invalidateSize();
      }, 400);

      window.addEventListener('resize', () => {
        map.invalidateSize();
        navMap.invalidateSize();
      });
    }

    // CAPTURA DE GPS REAL E EXATO
    function initRealGPS() {
      const dot = document.getElementById('gps-status-dot');
      const label = document.getElementById('gps-status-label');

      if (!navigator.geolocation) {
        label.textContent = 'GPS não suportado';
        dot.className = 'status-dot';
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          State.userLocation = [lat, lng];
          State.startCoords = [lat, lng];

          dot.className = 'status-dot active';
          label.textContent = 'GPS Conectado';

          // Centraliza no local exato do usuário
          map.setView([lat, lng], 15);
          map.invalidateSize();

          // Marcador do Usuário
          if (!userMarker) {
            userMarker = L.marker([lat, lng], {
              icon: L.divIcon({
                className: '',
                html: '<div class="gps-user-pulse"></div>',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
              })
            }).addTo(map);
          } else {
            userMarker.setLatLng([lat, lng]);
          }

          // Reverse Geocoding para obter o nome da rua real
          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const data = await res.json();
            State.startAddress = data.display_name ? data.display_name.split(',').slice(0, 3).join(',') : 'Minha Localização Atual';
          } catch(e) {
            State.startAddress = 'Minha Localização GPS';
          }

          document.getElementById('cfg-start-addr').value = State.startAddress;
          renderRoute();
          showToast('Localização exata capturada via GPS!', 'success');
        },
        (error) => {
          dot.className = 'status-dot';
          label.textContent = 'GPS sem permissão';
          showToast('Permita o acesso à localização para puxar seu ponto de partida real.', 'error');
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // DESENHO E TRAÇADO DA ROTA
    async function renderRoute() {
      markersLayer.clearLayers();
      if (State.routePolyline) {
        map.removeLayer(State.routePolyline);
        State.routePolyline = null;
      }

      const allCoords = [];

      // Adiciona ponto de partida real
      if (State.startCoords) {
        allCoords.push(State.startCoords);
        L.marker(State.startCoords, {
          icon: L.divIcon({
            className: 'custom-marker start',
            html: '<i class="fa-solid fa-play" style="font-size:0.6rem"></i>',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          })
        }).bindPopup(`<b>Ponto de Partida:</b><br>${State.startAddress}`).addTo(markersLayer);
      }

      // Adiciona paradas
      State.stops.forEach((stop, idx) => {
        allCoords.push([stop.lat, stop.lng]);
        L.marker([stop.lat, stop.lng], {
          icon: L.divIcon({
            className: 'custom-marker',
            html: `${idx + 1}`,
            iconSize: [26, 26],
            iconAnchor: [13, 13]
          })
        }).bindPopup(`<b>Parada ${idx + 1}:</b><br>${stop.name}<br>${stop.addr}`).addTo(markersLayer);
      });

      if (State.returnToStart && State.startCoords) {
        allCoords.push(State.startCoords);
      }

      // Traçado Viário via OSRM
      if (allCoords.length >= 2) {
        const coordString = allCoords.map(p => `${p[1]},${p[0]}`).join(';');
        try {
          const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordString}?overview=full&geometries=geojson`);
          const data = await res.json();

          if (data.code === 'Ok' && data.routes.length > 0) {
            const route = data.routes[0];
            const polyCoords = route.geometry.coordinates.map(c => [c[1], c[0]]);

            State.routePolyline = L.polyline(polyCoords, {
              color: '#00E599',
              weight: 5,
              opacity: 0.85
            }).addTo(map);

            document.getElementById('stat-dist').textContent = (route.distance / 1000).toFixed(1) + ' km';
            document.getElementById('stat-time').textContent = Math.round(route.duration / 60) + ' min';
          }
        } catch(e) {
          // Fallback Linha Reta
          State.routePolyline = L.polyline(allCoords, { color: '#00E599', weight: 4, dashArray: '6,6' }).addTo(map);
        }

        map.fitBounds(markersLayer.getBounds(), { padding: [40, 40] });
      }

      document.getElementById('badge-stops-count').textContent = State.stops.length;
      renderStopsUI();
    }

    // RENDERIZAÇÃO DA LISTA DE PARADAS
    function renderStopsUI() {
      const box = document.getElementById('stops-list-box');
      box.innerHTML = '';

      if (State.stops.length === 0) {
        box.innerHTML = `<div style="text-align:center; padding: 30px 10px; color: var(--text-subtle); font-size: 0.8rem;">Nenhuma parada carregada. Importe uma planilha ou adicione manualmente.</div>`;
        return;
      }

      State.stops.forEach((s, i) => {
        const card = document.createElement('div');
        card.className = 'stop-card';
        card.dataset.id = s.id;
        card.innerHTML = `
          <div class="stop-num">${i + 1}</div>
          <div class="stop-info">
            <div class="stop-name">${s.name}</div>
            <div class="stop-addr">${s.addr}</div>
          </div>
          <button class="btn btn-secondary btn-sm remove-stop" style="padding: 2px 6px;"><i class="fa-solid fa-trash" style="color:var(--accent-danger);"></i></button>
        `;

        card.querySelector('.remove-stop').addEventListener('click', (e) => {
          e.stopPropagation();
          State.stops.splice(i, 1);
          renderRoute();
        });

        box.appendChild(card);
      });
    }

    // DRAG & DROP
    function setupSortable() {
      const el = document.getElementById('stops-list-box');
      Sortable.create(el, {
        animation: 150,
        handle: '.stop-card',
        onEnd: () => {
          const reordered = [];
          document.querySelectorAll('.stop-card').forEach(card => {
            const st = State.stops.find(s => s.id === card.dataset.id);
            if (st) reordered.push(st);
          });
          State.stops = reordered;
          renderRoute();
          showToast('Ordem alterada manualmente.', 'info');
        }
      });
    }

    // MOTOR DE OTIMIZAÇÃO (NEAREST NEIGHBOR + 2-OPT)
    function calcDist(p1, p2) {
      const R = 6371;
      const dLat = (p2.lat - p1.lat) * Math.PI / 180;
      const dLon = (p2.lng - p1.lng) * Math.PI / 180;
      const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    async function optimizeRoute() {
      if (State.stops.length < 2) return;

      const start = State.startCoords ? { lat: State.startCoords[0], lng: State.startCoords[1] } : { lat: State.stops[0].lat, lng: State.stops[0].lng };
      let unvisited = [...State.stops];
      let current = start;
      const optimized = [];

      while (unvisited.length > 0) {
        let nearestIdx = 0;
        let minDist = Infinity;
        for (let i = 0; i < unvisited.length; i++) {
          const d = calcDist(current, unvisited[i]);
          if (d < minDist) {
            minDist = d;
            nearestIdx = i;
          }
        }
        current = unvisited[nearestIdx];
        optimized.push(unvisited.splice(nearestIdx, 1)[0]);
      }

      State.stops = optimized;
      await renderRoute();
      showToast('Sequência otimizada com sucesso!', 'success');
    }

    // IMPORTAÇÃO XLSX
    let parsedTemp = [];
    document.getElementById('xlsx-file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        if (json.length === 0) {
          showToast('Planilha vazia.', 'error');
          return;
        }

        // Reconhecimento Automático de Colunas
        const keys = Object.keys(json[0]);
        const addrKey = keys.find(k => /endere[cç]o|rua|address|logradouro/i.test(k)) || keys[1] || keys[0];
        const nameKey = keys.find(k => /nome|cliente|destinat[aá]rio|name/i.test(k)) || keys[0];

        parsedTemp = json.map((r, i) => ({
          id: 'p_' + Date.now() + '_' + i,
          name: r[nameKey] || `Parada #${i + 1}`,
          addr: r[addrKey] || ''
        })).filter(x => x.addr.length > 2);

        document.getElementById('import-msg').textContent = `${parsedTemp.length} paradas identificadas na planilha.`;
        document.getElementById('btn-confirm-import').removeAttribute('disabled');
      };
      reader.readAsArrayBuffer(file);
    });

    document.getElementById('btn-confirm-import').addEventListener('click', async () => {
      document.getElementById('modal-import').classList.remove('show');
      showToast('Geocodificando endereços...', 'info');

      // Geocodificação com fallback
      for (let s of parsedTemp) {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(s.addr)}&limit=1`);
          const data = await res.json();
          if (data.length > 0) {
            s.lat = parseFloat(data[0].lat);
            s.lng = parseFloat(data[0].lon);
          } else {
            throw new Error();
          }
        } catch(e) {
          // Ponto próximo à partida
          const baseLat = State.startCoords ? State.startCoords[0] : -23.55052;
          const baseLng = State.startCoords ? State.startCoords[1] : -46.633308;
          s.lat = baseLat + (Math.random() - 0.5) * 0.06;
          s.lng = baseLng + (Math.random() - 0.5) * 0.06;
        }
        State.stops.push(s);
      }

      renderRoute();
      showToast(`${parsedTemp.length} paradas carregadas no mapa!`, 'success');
    });

    // EVENTOS DE UI
    function bindEvents() {
      document.getElementById('btn-toggle-menu').addEventListener('click', () => {
        document.getElementById('app-sidebar').classList.toggle('open');
      });

      document.getElementById('btn-force-gps').addEventListener('click', initRealGPS);
      document.getElementById('btn-cfg-use-gps').addEventListener('click', initRealGPS);

      document.getElementById('btn-open-import').addEventListener('click', () => document.getElementById('modal-import').classList.add('show'));
      document.getElementById('btn-menu-import').addEventListener('click', () => document.getElementById('modal-import').classList.add('show'));
      document.getElementById('btn-close-import').addEventListener('click', () => document.getElementById('modal-import').classList.remove('show'));

      document.getElementById('btn-open-cfg').addEventListener('click', () => document.getElementById('modal-cfg').classList.add('show'));
      document.getElementById('btn-close-cfg').addEventListener('click', () => document.getElementById('modal-cfg').classList.remove('show'));
      document.getElementById('btn-save-cfg').addEventListener('click', () => {
        State.returnToStart = document.getElementById('cfg-return-start').value === 'true';
        document.getElementById('modal-cfg').classList.remove('show');
        renderRoute();
      });

      document.getElementById('btn-add-stop-manual').addEventListener('click', () => document.getElementById('modal-add-stop').classList.add('show'));
      document.getElementById('btn-close-add').addEventListener('click', () => document.getElementById('modal-add-stop').classList.remove('show'));
      document.getElementById('btn-save-add').addEventListener('click', async () => {
        const name = document.getElementById('add-stop-name').value || 'Parada';
        const addr = document.getElementById('add-stop-addr').value;
        if (!addr) return;

        let lat, lng;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}&limit=1`);
          const data = await res.json();
          lat = parseFloat(data[0].lat);
          lng = parseFloat(data[0].lon);
        } catch(e) {
          lat = (State.startCoords ? State.startCoords[0] : -23.55) + 0.02;
          lng = (State.startCoords ? State.startCoords[1] : -46.63) + 0.02;
        }

        State.stops.push({ id: 's_' + Date.now(), name, addr, lat, lng });
        document.getElementById('modal-add-stop').classList.remove('show');
        renderRoute();
        showToast('Parada adicionada.', 'success');
      });

      document.getElementById('btn-exec-optimize').addEventListener('click', optimizeRoute);

      // PDF
      document.getElementById('btn-gen-pdf').addEventListener('click', () => {
        if (State.stops.length === 0) return showToast('Nenhuma parada para exportar.', 'error');
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(16);
        doc.text('ROUTE FLOW — MANIFESTO DE ENTREGA', 14, 20);
        doc.setFontSize(10);
        doc.text(`Partida: ${State.startAddress}`, 14, 28);
        doc.text(`Total de Paradas: ${State.stops.length}`, 14, 34);

        const rows = State.stops.map((s, idx) => [idx + 1, s.name, s.addr]);
        doc.autoTable({
          startY: 40,
          head: [['#', 'Cliente / Identificador', 'Endereço Completo']],
          body: rows
        });
        doc.save('Rota_Otimizada.pdf');
        showToast('PDF gerado com sucesso!', 'success');
      });

      // MODO NAVEGAÇÃO
      document.getElementById('btn-start-nav').addEventListener('click', startNavigation);
      document.getElementById('btn-menu-nav').addEventListener('click', startNavigation);
      document.getElementById('btn-nav-exit').addEventListener('click', () => {
        document.getElementById('view-navigation').classList.remove('active');
        document.getElementById('view-optimizer').classList.add('active');
        setTimeout(() => map.invalidateSize(), 200);
      });

      document.getElementById('btn-nav-complete').addEventListener('click', () => {
        State.navIndex++;
        if (State.navIndex >= State.stops.length) {
          showToast('Todas as entregas foram concluídas!', 'success');
          document.getElementById('btn-nav-exit').click();
          return;
        }
        updateNavHUD();
      });
    }

    function startNavigation() {
      if (State.stops.length === 0) return showToast('Adicione paradas antes de navegar.', 'error');
      State.navIndex = 0;
      document.getElementById('view-optimizer').classList.remove('active');
      document.getElementById('view-navigation').classList.add('active');
      setTimeout(() => {
        navMap.invalidateSize();
        updateNavHUD();
      }, 300);
    }

    function updateNavHUD() {
      const stop = State.stops[State.navIndex];
      if (!stop) return;

      document.getElementById('nav-target-name').textContent = `Parada ${State.navIndex + 1}: ${stop.name}`;
      document.getElementById('nav-target-addr').textContent = stop.addr;
      navMap.setView([stop.lat, stop.lng], 16);
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-box');
      const item = document.createElement('div');
      item.className = 'toast-item';
      if (type === 'error') item.style.borderLeftColor = 'var(--accent-danger)';
      if (type === 'success') item.style.borderLeftColor = 'var(--accent-primary)';
      item.textContent = msg;
      box.appendChild(item);
      setTimeout(() => item.remove(), 3500);
    }
  </script>
</body>
</html>
