<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rota e Mato</title>
    <!-- SheetJS para ler Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF para gerar o PDF otimizado -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Leaflet CSS para o Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #131c31;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: var(--bg-surface);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo-area h1 {
            font-size: 17px;
            font-weight: 700;
            color: var(--success);
            letter-spacing: -0.3px;
        }

        .badge-status {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        #map {
            width: 100%;
            height: 38vh;
            background: #1a2234;
        }

        .panel {
            flex: 1;
            background: var(--bg-surface);
            padding: 16px;
            overflow-y: auto;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            margin-top: -14px;
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.4);
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .upload-box {
            background: var(--bg-card);
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px dashed var(--border);
            text-align: center;
            cursor: pointer;
        }

        .upload-label {
            font-size: 13px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="file"] {
            font-size: 13px;
            color: var(--text-main);
            width: 100%;
        }

        .actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 11px 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .stops-container {
            flex: 1;
            overflow-y: auto;
        }

        .stop-card {
            background: var(--bg-card);
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            border-left: 4px solid var(--success);
        }

        .stop-info {
            flex: 1;
            margin-right: 12px;
            min-width: 0;
        }

        .stop-num {
            font-size: 10px;
            color: var(--success);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stop-address {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stop-spx {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        .nav-btn {
            background: var(--success);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            padding: 30px 20px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>ROTA E MATO</h1>
        </div>
        <div id="status-paradas" class="badge-status">0 paradas</div>
    </header>

    <!-- Mapa Interativo -->
    <div id="map"></div>

    <!-- Painel Inferior Moderno -->
    <div class="panel">
        <div class="upload-box">
            <span class="upload-label">Carregar Planilha de Rotas (.xlsx)</span>
            <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="processarExcel()">
        </div>

        <div id="actions-wrapper" style="display: none;">
            <div class="actions-bar">
                <button class="btn btn-primary" onclick="executarOtimizacao()">
                    ⚡ Otimizar
                </button>
                <button class="btn btn-success" onclick="gerarPDF()">
                    📄 Gerar PDF
                </button>
            </div>
        </div>

        <div class="stops-container" id="lista-paradas">
            <div class="empty-state">
                Nenhuma planilha carregada.<br>Selecione o arquivo para iniciar.
            </div>
        </div>
    </div>

    <script>
        let map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let markersLayer = L.layerGroup().addTo(map);
        let listaGlobalParadas = [];

        function processarExcel() {
            const fileInput = document.getElementById('excelFile');
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                    listaGlobalParadas = jsonRows.map((row) => {
                        const endereco = row['Destination Address'] || row['Endereco'] || row['Endereço'] || Object.values(row)[0] || 'Endereço não informado';
                        const spx = row['SPX TN'] || row['Pacote'] || row['Código'] || 'SPX-N/A';
                        let lat = parseFloat(row['Latitude']) || (-23.5505 + (Math.random() * 0.05 - 0.025));
                        let lng = parseFloat(row['Longitude']) || (-46.6333 + (Math.random() * 0.05 - 0.025));

                        return { endereco, spx, lat, lng };
                    });

                    renderizarParadas(listaGlobalParadas);
                    document.getElementById('actions-wrapper').style.display = 'block';
                } catch (error) {
                    console.error(error);
                    alert('Erro ao ler a planilha.');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function executarOtimizacao() {
            if (listaGlobalParadas.length === 0) return;

            let naoVisitados = [...listaGlobalParadas];
            let otimizadas = [];

            let atual = naoVisitados.shift();
            otimizadas.push(atual);

            while (naoVisitados.length > 0) {
                let maisProximoIndex = 0;
                let menorDistancia = Infinity;

                for (let i = 0; i < naoVisitados.length; i++) {
                    let p = naoVisitados[i];
                    let dist = Math.pow(p.lat - atual.lat, 2) + Math.pow(p.lng - atual.lng, 2);
                    if (dist < menorDistancia) {
                        menorDistancia = dist;
                        maisProximoIndex = i;
                    }
                }

                atual = naoVisitados.splice(maisProximoIndex, 1)[0];
                otimizadas.push(atual);
            }

            listaGlobalParadas = otimizadas;
            renderizarParadas(listaGlobalParadas);
        }

        function gerarPDF() {
            if (listaGlobalParadas.length === 0) {
                alert('Nenhuma rota para exportar!');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("ROTA E MATO - Relatorio de Rota Otimizada", 14, 20);

            doc.setFont("helvetica", "normal");
            doc.setFontSize(10);
            doc.text(`Total de Paradas: ${listaGlobalParadas.length}`, 14, 28);
            doc.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 14, 34);

            let y = 45;
            doc.setLineWidth(0.5);

            listaGlobalParadas.forEach((item, index) => {
                if (y > 270) {
                    doc.addPage();
                    y = 20;
                }

                doc.setFont("helvetica", "bold");
                doc.text(`Parada ${index + 1}:`, 14, y);
                
                doc.setFont("helvetica", "normal");
                doc.text(`Endereco: ${item.endereco}`, 32, y);
                doc.text(`Pacote SPX: ${item.spx}`, 32, y + 5);

                doc.setLineDash([1, 1], 0);
                doc.line(14, y + 8, 196, y + 8);
                doc.setLineDash([]);

                y += 14;
            });

            doc.save("rota-otimizada-spx.pdf");
        }

        function renderizarParadas(paradas) {
            const container = document.getElementById('lista-paradas');
            container.innerHTML = '';
            markersLayer.clearLayers();

            document.getElementById('status-paradas').innerText = `${paradas.length} paradas`;
            let bounds = [];

            paradas.forEach((item, index) => {
                const numero = index + 1;
                bounds.push([item.lat, item.lng]);

                let marker = L.marker([item.lat, item.lng]).bindPopup(`<b>Parada ${numero}</b><br>${item.endereco}<br><small>${item.spx}</small>`);
                markersLayer.addLayer(marker);

                const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.endereco)}`;

                container.innerHTML += `
                    <div class="stop-card">
                        <div class="stop-info">
                            <div class="stop-num">Parada ${numero}</div>
                            <div class="stop-address" title="${item.endereco}">${item.endereco}</div>
                            <div class="stop-spx">📦 ${item.spx}</div>
                        </div>
                        <a href="${urlMaps}" target="_blank" class="nav-btn">Navegar</a>
                    </div>
                `;
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }
    </script>
</body>
</html>
