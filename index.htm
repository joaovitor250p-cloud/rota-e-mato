<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otimizador de rota</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#14171c;
    --ink-800:#1b1f26;
    --ink-700:#242a33;
    --ink-600:#2d3440;
    --line:#39414d;
    --text-hi:#eeece5;
    --text-lo:#9aa0ab;
    --blue:#3b6ef6;
    --blue-dim:#2b52b8;
    --yellow:#f4b400;
    --red:#e15554;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Space Grotesk', sans-serif;
    background:var(--ink-900);
    color:var(--text-hi);
    overflow:hidden;
  }
  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }
  /* ---------- sidebar ---------- */
  .sidebar{
    width:380px;
    flex:none;
    background:var(--ink-900);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .sidebar-head{
    padding:20px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .sidebar-head h1{
    margin:0 0 2px;
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .sidebar-head p{
    margin:0;
    font-size:13px;
    color:var(--text-lo);
  }
  .add-row{
    display:flex;
    gap:8px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
  }
  .add-row input{
    flex:1;
    background:var(--ink-700);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--text-hi);
    padding:10px 12px;
    font-size:13.5px;
    font-family:inherit;
    min-width:0;
  }
  .add-row input::placeholder{color:var(--text-lo);}
  .add-row input:focus{outline:none;border-color:var(--blue);}
  .add-row button{
    background:var(--blue);
    border:none;
    color:white;
    width:38px;
    border-radius:var(--radius);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    flex:none;
  }
  .add-row button:hover{background:var(--blue-dim);}
  .add-row button:disabled{opacity:.5;cursor:default;}
  .status-line{
    padding:0 20px;
    font-size:12px;
    color:var(--text-lo);
    min-height:0;
  }
  .status-line.error{color:var(--red);}
  .status-line.visible{padding:8px 20px;}

  .stop-list{
    flex:1;
    overflow-y:auto;
    padding:8px 12px;
  }
  .empty-state{
    margin:24px 8px;
    padding:18px;
    border:1px dashed var(--line);
    border-radius:var(--radius);
    color:var(--text-lo);
    font-size:13px;
    line-height:1.5;
  }
  .stop{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 8px;
    border-radius:var(--radius);
    margin-bottom:2px;
    cursor:grab;
    border:1px solid transparent;
  }
  .stop:hover{background:var(--ink-700);}
  .stop.dragging{opacity:.35;}
  .stop.drag-over{border-top:2px solid var(--blue);}
  .stop .handle{
    color:var(--text-lo);
    font-size:14px;
    flex:none;
    width:14px;
    text-align:center;
    user-select:none;
  }
  .stop .badge{
    flex:none;
    width:26px;
    height:26px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:500;
    background:var(--blue);
    color:white;
  }
  .stop:first-child .badge{background:var(--yellow); color:#1b1f26;}
  .stop .addr{
    flex:1;
    min-width:0;
    font-size:13.5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .stop .role{
    display:block;
    font-size:10.5px;
    color:var(--text-lo);
    margin-top:1px;
  }
  .stop .remove{
    flex:none;
    background:none;
    border:none;
    color:var(--text-lo);
    cursor:pointer;
    font-size:16px;
    padding:2px 4px;
    border-radius:6px;
    line-height:1;
  }
  .stop .remove:hover{color:var(--red); background:var(--ink-600);}

  .sidebar-foot{
    border-top:1px solid var(--line);
    padding:16px 20px 18px;
  }
  .stats{
    display:flex;
    gap:18px;
    margin-bottom:14px;
    font-family:'IBM Plex Mono', monospace;
  }
  .stats .stat b{
    display:block;
    font-size:18px;
    font-weight:600;
  }
  .stats .stat span{
    font-size:11px;
    color:var(--text-lo);
    font-family:'Space Grotesk', sans-serif;
  }
  .btn-row{display:flex; flex-direction:column; gap:8px;}
  .btn{
    border:none;
    border-radius:var(--radius);
    padding:11px 14px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-dim);}
  .btn-primary:disabled{background:var(--ink-600); color:var(--text-lo); cursor:default;}
  .btn-ghost{background:var(--ink-700); color:var(--text-hi); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--ink-600);}
  .btn-ghost:disabled{color:var(--text-lo); cursor:default;}

  /* ---------- map ---------- */
  .map-wrap{flex:1; min-width:0; position:relative;}
  #map{height:100%; width:100%; background:var(--ink-800);}
  .num-icon{
    width:26px; height:26px;
    border-radius:50% 50% 50% 0;
    transform: rotate(45deg);
    background:var(--blue);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 1px 4px rgba(0,0,0,.4);
  }
  .num-icon.start{background:var(--yellow);}
  .num-icon span{
    transform: rotate(-45deg);
    color:#fff;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    font-weight:600;
  }
  .num-icon.start span{color:#1b1f26;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }

  @media (max-width: 720px){
    .app{flex-direction:column;}
    .sidebar{width:100%; max-height:52vh; border-right:none; border-bottom:1px solid var(--line);}
    .map-wrap{flex:1;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <h1>Rota</h1>
      <p>Adicione os endereços na ordem que encontrar — depois otimize.</p>
    </div>
    <div class="add-row">
      <input id="addrInput" type="text" placeholder="Digite um endereço e pressione Enter" autocomplete="off">
      <button id="addBtn" aria-label="Adicionar endereço">+</button>
    </div>
    <div class="status-line" id="statusLine"></div>
    <div class="stop-list" id="stopList">
      <div class="empty-state" id="emptyState">
        Sua lista de paradas vai aparecer aqui. O primeiro endereço adicionado é a partida.
      </div>
    </div>
    <div class="sidebar-foot">
      <div class="stats">
        <div class="stat"><b id="statDist">—</b><span>distância</span></div>
        <div class="stat"><b id="statTime">—</b><span>tempo estimado</span></div>
        <div class="stat"><b id="statStops">0</b><span>paradas</span></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="optimizeBtn" disabled>Otimizar rota</button>
        <button class="btn btn-ghost" id="mapsBtn" disabled>Abrir no Google Maps</button>
      </div>
    </div>
  </div>
  <div class="map-wrap">
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const map = L.map('map', {zoomControl:true}).setView([-14.2350, -51.9253], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'&copy; OpenStreetMap contributors',
    maxZoom:19
  }).addTo(map);

  let stops = [];      // {id, address, lat, lon, marker}
  let routeLine = null;
  let idSeq = 1;

  const els = {
    input: document.getElementById('addrInput'),
    addBtn: document.getElementById('addBtn'),
    status: document.getElementById('statusLine'),
    list: document.getElementById('stopList'),
    empty: document.getElementById('emptyState'),
    statDist: document.getElementById('statDist'),
    statTime: document.getElementById('statTime'),
    statStops: document.getElementById('statStops'),
    optimizeBtn: document.getElementById('optimizeBtn'),
    mapsBtn: document.getElementById('mapsBtn'),
  };

  function setStatus(msg, isError){
    els.status.textContent = msg || '';
    els.status.classList.toggle('error', !!isError);
    els.status.classList.toggle('visible', !!msg);
  }

  function makeIcon(num, isStart){
    return L.divIcon({
      className:'',
      html:`<div class="num-icon${isStart?' start':''}"><span>${num}</span></div>`,
      iconSize:[26,26],
      iconAnchor:[13,24]
    });
  }

  function refreshMarkers(){
    stops.forEach((s, i) => {
      if(s.marker){
        s.marker.setIcon(makeIcon(i+1, i===0));
      }
    });
  }

  async function geocode(query){
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if(!res.ok) throw new Error('geocode-failed');
    const data = await res.json();
    if(!data.length) throw new Error('not-found');
    return {lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name};
  }

  async function addStop(address){
    if(!address.trim()) return;
    els.addBtn.disabled = true;
    setStatus('Localizando endereço…');
    try{
      const g = await geocode(address);
      const marker = L.marker([g.lat, g.lon], {icon: makeIcon(stops.length+1, stops.length===0)}).addTo(map);
      stops.push({id: idSeq++, address: address.trim(), lat:g.lat, lon:g.lon, marker});
      setStatus('');
      render();
      fitBounds();
      if(stops.length >= 2) computeRoute();
    }catch(e){
      setStatus('Endereço não encontrado. Tente ser mais específico.', true);
    }finally{
      els.addBtn.disabled = false;
    }
  }

  function removeStop(id){
    const idx = stops.findIndex(s => s.id === id);
    if(idx === -1) return;
    map.removeLayer(stops[idx].marker);
    stops.splice(idx,1);
    render();
    refreshMarkers();
    if(stops.length >= 2){ computeRoute(); } else { clearRoute(); }
  }

  function fitBounds(){
    if(stops.length === 0) return;
    if(stops.length === 1){ map.setView([stops[0].lat, stops[0].lon], 13); return; }
    const bounds = L.latLngBounds(stops.map(s => [s.lat, s.lon]));
    map.fitBounds(bounds, {padding:[60,60]});
  }

  function clearRoute(){
    if(routeLine){ map.removeLayer(routeLine); routeLine = null; }
    els.statDist.textContent = '—';
    els.statTime.textContent = '—';
    els.optimizeBtn.disabled = stops.length < 3;
    els.mapsBtn.disabled = stops.length < 2;
  }

  function formatDist(meters){
    return (meters/1000).toFixed(1).replace('.', ',') + ' km';
  }
  function formatTime(seconds){
    const m = Math.round(seconds/60);
    if(m < 60) return m + ' min';
    const h = Math.floor(m/60); const rm = m % 60;
    return h + 'h ' + (rm ? rm+'min' : '');
  }

  function coordsParam(list){
    return list.map(s => `${s.lon},${s.lat}`).join(';');
  }

  async function computeRoute(){
    if(stops.length < 2) return;
    setStatus('Calculando rota…');
    try{
      const url = `https://router.project-osrm.org/route/v1/driving/${coordsParam(stops)}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.code !== 'Ok') throw new Error('route-failed');
      const route = data.routes[0];
      drawRoute(route.geometry.coordinates);
      els.statDist.textContent = formatDist(route.distance);
      els.statTime.textContent = formatTime(route.duration);
      setStatus('');
    }catch(e){
      setStatus('Não consegui calcular a rota agora.', true);
    }
    els.optimizeBtn.disabled = stops.length < 3;
    els.mapsBtn.disabled = stops.length < 2;
  }

  async function optimizeRoute(){
    if(stops.length < 3) return;
    els.optimizeBtn.disabled = true;
    setStatus('Otimizando ordem das paradas…');
    try{
      const url = `https://router.project-osrm.org/trip/v1/driving/${coordsParam(stops)}?source=first&roundtrip=false&overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if(data.code !== 'Ok') throw new Error('trip-failed');

      const ordered = data.waypoints
        .map((wp, originalIdx) => ({wp, originalIdx}))
        .sort((a,b) => a.wp.waypoint_index - b.wp.waypoint_index)
        .map(x => stops[x.originalIdx]);
      stops = ordered;

      stops.forEach((s,i) => map.removeLayer(s.marker));
      stops.forEach((s,i) => {
        s.marker = L.marker([s.lat, s.lon], {icon: makeIcon(i+1, i===0)}).addTo(map);
      });

      const trip = data.trips[0];
      drawRoute(trip.geometry.coordinates);
      els.statDist.textContent = formatDist(trip.distance);
      els.statTime.textContent = formatTime(trip.duration);
      render();
      setStatus('Rota otimizada.');
      setTimeout(()=>setStatus(''), 2500);
    }catch(e){
      setStatus('Não consegui otimizar agora. Tente novamente.', true);
    }
    els.optimizeBtn.disabled = stops.length < 3;
  }

  function drawRoute(coords){
    if(routeLine) map.removeLayer(routeLine);
    const latlngs = coords.map(c => [c[1], c[0]]);
    routeLine = L.polyline(latlngs, {color:'#3b6ef6', weight:4, opacity:.85}).addTo(map);
  }

  function openInGoogleMaps(){
    if(stops.length < 2) return;
    const origin = `${stops[0].lat},${stops[0].lon}`;
    const destination = `${stops[stops.length-1].lat},${stops[stops.length-1].lon}`;
    const mid = stops.slice(1,-1).map(s => `${s.lat},${s.lon}`).join('|');
    let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=driving`;
    if(mid) url += `&waypoints=${encodeURIComponent(mid)}`;
    window.open(url, '_blank');
  }

  // ---- list rendering + drag reorder ----
  let dragId = null;

  function render(){
    els.list.querySelectorAll('.stop').forEach(n => n.remove());
    els.empty.style.display = stops.length ? 'none' : 'block';
    els.statStops.textContent = stops.length;

    stops.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'stop';
      row.draggable = true;
      row.dataset.id = s.id;
      row.innerHTML = `
        <span class="handle">⠿</span>
        <span class="badge">${i+1}</span>
        <span class="addr">${escapeHtml(s.address)}<span class="role">${i===0?'Partida':'Parada'}</span></span>
        <button class="remove" aria-label="Remover">×</button>
      `;
      row.querySelector('.remove').addEventListener('click', () => removeStop(s.id));

      row.addEventListener('dragstart', e => {
        dragId = s.id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      row.addEventListener('dragend', () => {
        row.classList.remove('dragging');
        els.list.querySelectorAll('.stop').forEach(n => n.classList.remove('drag-over'));
      });
      row.addEventListener('dragover', e => {
        e.preventDefault();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', e => {
        e.preventDefault();
        row.classList.remove('drag-over');
        if(dragId === null || dragId === s.id) return;
        const fromIdx = stops.findIndex(x => x.id === dragId);
        const toIdx = stops.findIndex(x => x.id === s.id);
        const [moved] = stops.splice(fromIdx,1);
        stops.splice(toIdx,0,moved);
        refreshMarkers();
        render();
        if(stops.length >= 2) computeRoute();
      });

      els.list.appendChild(row);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- events ----
  els.addBtn.addEventListener('click', () => {
    const v = els.input.value;
    els.input.value = '';
    addStop(v);
  });
  els.input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){
      const v = els.input.value;
      els.input.value = '';
      addStop(v);
    }
  });
  els.optimizeBtn.addEventListener('click', optimizeRoute);
  els.mapsBtn.addEventListener('click', openInGoogleMaps);

  render();
})();
</script>
</body>
</html>
