<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota e Mato - SPX</title>
    <!-- Importando a biblioteca PDF.js para ler arquivos PDF no navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Configurando o worker do PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            color: #4CAF50;
            margin-bottom: 4px;
            text-align: center;
        }
        p.subtitle {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 20px;
        }
        .card {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: #b0b0b0;
        }
        input[type="file"] {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            padding: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        button:hover {
            background: #45a049;
        }
        .stop-item {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4CAF50;
        }
        .stop-info {
            flex: 1;
            margin-right: 10px;
        }
        .stop-num {
            font-size: 11px;
            color: #4CAF50;
            font-weight: bold;
            text-transform: uppercase;
        }
        .stop-address {
            font-size: 14px;
            color: #fff;
            margin-top: 2px;
        }
        .nav-btn {
            background: #2196F3;
            color: white;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }
        .nav-btn:hover {
            background: #1976D2;
        }
        #lista-paradas {
            margin-top: 15px;
        }
        .empty-state {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }
        .loading {
            text-align: center;
            color: #4CAF50;
            font-weight: bold;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Rota e Mato</h1>
        <p class="subtitle">Leitor de PDF & Otimizador SPX</p>

        <div class="card">
            <label for="pdfFile">Selecione o PDF da SPX:</label>
            <input type="file" id="pdfFile" accept=".pdf">
            <button onclick="processarPDF()">Ler PDF e Gerar Rota</button>
        </div>

        <div class="card">
            <label>Paradas Identificadas:</label>
            <div id="lista-paradas">
                <div class="empty-state">Nenhum PDF carregado ainda.</div>
            </div>
        </div>
    </div>

    <script>
        async function processarPDF() {
            const fileInput = document.getElementById('pdfFile');
            const container = document.getElementById('lista-paradas');

            if (fileInput.files.length === 0) {
                alert('Por favor, selecione um arquivo PDF!');
                return;
            }

            const file = fileInput.files[0];
            container.innerHTML = '<div class="loading">Lendo PDF da SPX...</div>';

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let textoCompleto = '';

                // Extrai o texto de todas as páginas do PDF
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const textosPagina = textContent.items.map(item => item.str);
                    textoCompleto += textosPagina.join(' ') + '\n';
                }

                // Processa o texto extraído para achar endereços ou blocos relevantes da SPX
                gerarParadasDoTexto(textoCompleto);

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state" style="color: #ff5252;">Erro ao ler o PDF. Verifique se o arquivo é válido.</div>';
            }
        }

        function gerarParadasDoTexto(texto) {
            const container = document.getElementById('lista-paradas');
            container.innerHTML = '';

            // Limpa quebras excessivas e divide por linhas ou blocos lógicos
            let linhas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 5);

            if (linhas.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhum endereço encontrado neste PDF.</div>';
                return;
            }

            // Exibindo as linhas encontradas como paradas (futuramente refinaremos o filtro para focar exatamente no padrão de endereço da SPX)
            linhas.forEach((endereco, index) => {
                const numeroParada = index + 1;
                const urlMaps = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(endereco)}`;

                const itemHTML = `
                    <div class="stop-item">
                        <div class="stop-info">
                            <div class="stop-num">Parada ${numeroParada}</div>
                            <div class="stop-address">${endereco}</div>
                        </div>
                        <a href="${urlMaps}" target="_blank" class="nav-btn">Navegar</a>
                    </div>
                `;
                container.innerHTML += itemHTML;
            });
        }
    </script>

</body>
</html>
