<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Contas João & Raquel</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: text;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex justify-center">

  <div id="root" class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col relative shadow-xl pb-24"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DADOS INICIAIS / PADRÃO ---
    const CATEGORIAS = [
      { id: 'Delivery', label: 'Delivery', icon: '🍔' },
      { id: 'Mercado', label: 'Mercado', icon: '🛒' },
      { id: 'Combustível', label: 'Combustível', icon: '⛽' },
      { id: 'Casa', label: 'Casa', icon: '🏠' },
      { id: 'Lazer', label: 'Lazer', icon: '🎮' },
      { id: 'Outros', label: 'Outros', icon: '📦' }
    ];

    const CONTAS_FIXAS_BASE = [
      { id: 'f1', nome: 'Aluguel', valor: 1500, dia: 5, responsavel: 'Casal', categoria: 'Casa', ativa: true },
      { id: 'f2', nome: 'Energia', valor: 250, dia: 5, responsavel: 'Casal', categoria: 'Casa', ativa: true },
      { id: 'f3', nome: 'Internet', valor: 120, dia: 20, responsavel: 'Casal', categoria: 'Casa', ativa: true },
      { id: 'f4', nome: 'Água', valor: 80, dia: 20, responsavel: 'Casal', categoria: 'Casa', ativa: true },
    ];

    const CARTAO_OPCOES = [
      { id: 'nenhum', label: 'Dinheiro / Pix / Débito' },
      { id: 'j5', label: 'Cartão João (Dia 5)', dono: 'João', dia: 5 },
      { id: 'j20', label: 'Cartão João (Dia 20)', dono: 'João', dia: 20 },
      { id: 'r5', label: 'Cartão Raquel (Dia 5)', dono: 'Raquel', dia: 5 },
      { id: 'r20', label: 'Cartão Raquel (Dia 20)', dono: 'Raquel', dia: 20 },
    ];

    function App() {
      // Estado de Data
      const [dataAtual, setDataAtual] = useState(() => {
        const now = new Date();
        return { mes: now.getMonth(), ano: now.getFullYear() };
      });

      // Estados Principais com Persistência
      const [gastos, setGastos] = useState(() => {
        const saved = localStorage.getItem('jr_gastos');
        return saved ? JSON.parse(saved) : [];
      });

      const [contasFixas, setContasFixas] = useState(() => {
        const saved = localStorage.getItem('jr_contas_fixas');
        return saved ? JSON.parse(saved) : CONTAS_FIXAS_BASE;
      });

      const [statusPagamento, setStatusPagamento] = useState(() => {
        const saved = localStorage.getItem('jr_status_pagamento');
        return saved ? JSON.parse(saved) : {}; // chave: "ano-mes-idConta" -> boolean
      });

      const [abaAtiva, setAbaAtiva] = useState('inicio');
      const [modalAberto, setModalAberto] = useState(false);
      const [modoEdicaoFixa, setModoEdicaoFixa] = useState(null);

      // Formulário de Gasto
      const [inputRapido, setInputRapido] = useState('');
      const [descricao, setDescricao] = useState('');
      const [valor, setValor] = useState('');
      const [responsavel, setResponsavel] = useState('João');
      const [categoria, setCategoria] = useState('Mercado');
      const [cartaoSelecionado, setCartaoSelecionado] = useState('nenhum');
      const [parcelas, setParcelas] = useState(1);

      useEffect(() => {
        localStorage.setItem('jr_gastos', JSON.stringify(gastos));
      }, [gastos]);

      useEffect(() => {
        localStorage.setItem('jr_contas_fixas', JSON.stringify(contasFixas));
      }, [contasFixas]);

      useEffect(() => {
        localStorage.setItem('jr_status_pagamento', JSON.stringify(statusPagamento));
      }, [statusPagamento]);

      // Navegação do Mês
      const trocarMes = (direcao) => {
        setDataAtual(prev => {
          let novoMes = prev.mes + direcao;
          let novoAno = prev.ano;
          if (novoMes > 11) { novoMes = 0; novoAno++; }
          if (novoMes < 0) { novoMes = 11; novoAno--; }
          return { mes: novoMes, ano: novoAno };
        });
      };

      const nomeMes = useMemo(() => {
        const d = new Date(dataAtual.ano, dataAtual.mes, 1);
        return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).toUpperCase();
      }, [dataAtual]);

      // Parser Inteligente de Texto (WhatsApp Style)
      const parseTextoRapido = (texto) => {
        setInputRapido(texto);
        if (!texto.trim()) return;

        let limpo = texto.toLowerCase();
        
        // Identificar Responsável
        let respDetectado = null;
        if (limpo.includes('joão') || limpo.includes('joao')) respDetectado = 'João';
        else if (limpo.includes('raquel')) respDetectado = 'Raquel';
        else if (limpo.includes('casal')) respDetectado = 'Casal';

        // Identificar Categoria
        let catDetectada = null;
        CATEGORIAS.forEach(cat => {
          if (limpo.includes(cat.label.toLowerCase()) || limpo.includes(cat.id.toLowerCase())) {
            catDetectada = cat.id;
          }
        });
        if (limpo.includes('ifood') || limpo.includes('lanche') || limpo.includes('pizza') || limpo.includes('hamburguer')) {
          catDetectada = 'Delivery';
        }

        // Identificar Valor
        const matchValor = texto.match(/(\d+[.,]?\d*)/);
        let valorDetectado = matchValor ? matchValor[0].replace(',', '.') : '';

        // Limpeza da Descrição
        let desc = texto
          .replace(/joão|joao|raquel|casal/gi, '')
          .replace(/delivery|mercado|combustível|combustivel|casa|lazer|outros/gi, '')
          .replace(/(\d+[.,]?\d*)/g, '')
          .trim();

        if (respDetectado) setResponsavel(respDetectado);
        if (catDetectada) setCategoria(catDetectada);
        if (valorDetectado) setValor(valorDetectado);
        if (desc) setDescricao(desc.charAt(0).toUpperCase() + desc.slice(1));
        else if (catDetectada) setDescricao(catDetectada);
      };

      // Salvar Novo Gasto / Parcelas
      const salvarGasto = () => {
        const numValor = parseFloat(valor);
        if (isNaN(numValor) || numValor <= 0) return;

        const numParcelas = parseInt(parcelas) || 1;
        const valorParcela = numValor / numParcelas;
        const novosGastos = [];
        const baseId = Date.now().toString();

        for (let i = 0; i < numParcelas; i++) {
          let mesParcela = dataAtual.mes + i;
          let anoParcela = dataAtual.ano;
          while (mesParcela > 11) {
            mesParcela -= 12;
            anoParcela += 1;
          }

          novosGastos.push({
            id: `${baseId}_${i}`,
            descricao: numParcelas > 1 ? `${descricao || categoria} (${i + 1}/${numParcelas})` : (descricao || categoria),
            valor: valorParcela,
            responsavel,
            categoria,
            cartao: cartaoSelecionado,
            mes: mesParcela,
            ano: anoParcela,
            pago: false,
            dataRegistro: new Date().toISOString()
          });
        }

        setGastos(prev => [...novosGastos, ...prev]);
        fecharModal();
      };

      const fecharModal = () => {
        setModalAberto(false);
        setInputRapido('');
        setDescricao('');
        setValor('');
        setResponsavel('João');
        setCategoria('Mercado');
        setCartaoSelecionado('nenhum');
        setParcelas(1);
      };

      const toggleStatus = (id) => {
        const chave = `${dataAtual.ano}-${dataAtual.mes}-${id}`;
        setStatusPagamento(prev => ({ ...prev, [chave]: !prev[chave] }));
      };

      const toggleGastoPago = (id) => {
        setGastos(prev => prev.map(g => g.id === id ? { ...g, pago: !g.pago } : g));
      };

      const excluirGasto = (id) => {
        setGastos(prev => prev.filter(g => g.id !== id));
      };

      // Cálculos do Mês Selecionado
      const gastosMes = useMemo(() => {
        return gastos.filter(g => g.mes === dataAtual.mes && g.ano === dataAtual.ano);
      }, [gastos, dataAtual]);

      // Faturas de Cartão Agrupadas por Dia (5 e 20)
      const faturas = useMemo(() => {
        const res = { j5: 0, j20: 0, r5: 0, r20: 0 };
        gastosMes.forEach(g => {
          if (g.cartao && res[g.cartao] !== undefined) {
            res[g.cartao] += g.valor;
          }
        });
        return res;
      }, [gastosMes]);

      // Totais Consolidados (Contas Fixas + Cartões + Gastos Avulsos)
      const metricas = useMemo(() => {
        const fixasAtivas = contasFixas.filter(f => f.ativa);
        
        let totalFixas = fixasAtivas.reduce((acc, cur) => acc + cur.valor, 0);
        let totalGastosForaCartao = gastosMes.filter(g => g.cartao === 'nenhum').reduce((acc, cur) => acc + cur.valor, 0);
        let totalCartoes = Object.values(faturas).reduce((a, b) => a + b, 0);

        let totalGeral = totalFixas + totalGastosForaCartao + totalCartoes;

        // Cálculo de Pagos vs A Pagar
        let pago = 0;
        fixasAtivas.forEach(f => {
          const chave = `${dataAtual.ano}-${dataAtual.mes}-${f.id}`;
          if (statusPagamento[chave]) pago += f.valor;
        });
        ['j5', 'j20', 'r5', 'r20'].forEach(cId => {
          const chave = `${dataAtual.ano}-${dataAtual.mes}-${cId}`;
          if (statusPagamento[chave]) pago += faturas[cId];
        });
        gastosMes.filter(g => g.cartao === 'nenhum' && g.pago).forEach(g => {
          pago += g.valor;
        });

        const aPagar = Math.max(0, totalGeral - pago);

        // Subtotais Dia 5 e Dia 20
        const fixasDia5 = fixasAtivas.filter(f => f.dia === 5).reduce((a, b) => a + b.valor, 0);
        const totalDia5 = fixasDia5 + faturas.j5 + faturas.r5;

        const fixasDia20 = fixasAtivas.filter(f => f.dia === 20).reduce((a, b) => a + b.valor, 0);
        const totalDia20 = fixasDia20 + faturas.j20 + faturas.r20;

        // Por Pessoa
        let totalJoao = 0;
        let totalRaquel = 0;
        let totalCasal = 0;

        fixasAtivas.forEach(f => {
          if (f.responsavel === 'João') totalJoao += f.valor;
          else if (f.responsavel === 'Raquel') totalRaquel += f.valor;
          else totalCasal += f.valor;
        });

        gastosMes.forEach(g => {
          if (g.responsavel === 'João') totalJoao += g.valor;
          else if (g.responsavel === 'Raquel') totalRaquel += g.valor;
          else totalCasal += g.valor;
        });

        // Delivery
        const deliveryGastos = gastosMes.filter(g => g.categoria === 'Delivery');
        const deliveryTotal = deliveryGastos.reduce((a, b) => a + b.valor, 0);
        const deliveryCount = deliveryGastos.length;
        const deliveryJoao = deliveryGastos.filter(g => g.responsavel === 'João').reduce((a, b) => a + b.valor, 0);
        const deliveryRaquel = deliveryGastos.filter(g => g.responsavel === 'Raquel').reduce((a, b) => a + b.valor, 0);

        return {
          totalGeral,
          pago,
          aPagar,
          totalDia5,
          totalDia20,
          totalJoao,
          totalRaquel,
          totalCasal,
          deliveryTotal,
          deliveryCount,
          deliveryJoao,
          deliveryRaquel
        };
      }, [gastosMes, contasFixas, statusPagamento, faturas, dataAtual]);

      return (
        <div className="flex flex-col flex-1">
          {/* TOPO: SELETOR DE MÊS */}
          <header className="bg-slate-900 text-white p-4 pt-6 sticky top-0 z-30 shadow-md flex items-center justify-between">
            <button onClick={() => trocarMes(-1)} className="p-2 rounded-full hover:bg-slate-800 text-xl font-bold">←</button>
            <h1 className="text-sm font-extrabold tracking-wider">{nomeMes}</h1>
            <button onClick={() => trocarMes(1)} className="p-2 rounded-full hover:bg-slate-800 text-xl font-bold">→</button>
          </header>

          {/* CONTEÚDO PRINCIPAL DAS ABAS */}
          <main className="p-4 flex-1">
            {/* --- ABA INÍCIO --- */}
            {abaAtiva === 'inicio' && (
              <div className="space-y-4">
                {/* BOTÃO PRINCIPAL NOVO GASTO */}
                <button 
                  onClick={() => setModalAberto(true)}
                  className="w-full bg-emerald-500 active:bg-emerald-600 text-white font-black text-lg py-4 rounded-2xl shadow-lg flex items-center justify-center space-x-2 transition-all transform active:scale-98"
                >
                  <span className="text-2xl">+</span>
                  <span>NOVO GASTO</span>
                </button>

                {/* CARD RESUMO PRINCIPAL */}
                <div className="bg-white rounded-3xl p-5 shadow-sm border border-slate-200">
                  <span className="text-xs font-bold text-slate-400 tracking-wider">TOTAL DO MÊS</span>
                  <div className="text-3xl font-extrabold text-slate-800 my-1">
                    R$ {metricas.totalGeral.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                  </div>
                  <div className="grid grid-cols-2 gap-3 mt-4 pt-4 border-t border-slate-100">
                    <div className="bg-rose-50 p-3 rounded-2xl">
                      <span className="text-xs font-bold text-rose-500 flex items-center gap-1">🔴 A PAGAR</span>
                      <span className="text-base font-bold text-rose-700 mt-0.5 block">
                        R$ {metricas.aPagar.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                      </span>
                    </div>
                    <div className="bg-emerald-50 p-3 rounded-2xl">
                      <span className="text-xs font-bold text-emerald-600 flex items-center gap-1">🟢 JÁ PAGO</span>
                      <span className="text-base font-bold text-emerald-800 mt-0.5 block">
                        R$ {metricas.pago.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                      </span>
                    </div>
                  </div>
                </div>

                {/* PRÓXIMO VENCIMENTO */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-slate-400 block">PRÓXIMO VENCIMENTO</span>
                    <span className="text-sm font-extrabold text-slate-800">Dia 5 • R$ {metricas.totalDia5.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                  </div>
                  <button 
                    onClick={() => setAbaAtiva('contas')}
                    className="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-2 rounded-xl"
                  >
                    VER CONTAS
                  </button>
                </div>

                {/* ALERTA / RESUMO DELIVERY */}
                <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center space-x-2">
                      <span className="text-2xl">🍔</span>
                      <div>
                        <span className="text-xs font-bold text-amber-900 block">DELIVERY NO MÊS</span>
                        <span className="text-lg font-black text-amber-900">
                          R$ {metricas.deliveryTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                        </span>
                      </div>
                    </div>
                    <span className="text-xs font-bold bg-amber-200 text-amber-800 px-2 py-1 rounded-lg">
                      {metricas.deliveryCount} pedidos
                    </span>
                  </div>
                  {metricas.deliveryTotal > 400 && (
                    <div className="mt-3 text-xs font-semibold text-amber-800 bg-amber-100/70 p-2 rounded-xl">
                      ⚠️ Vocês já gastaram R$ {metricas.deliveryTotal.toFixed(0)} em Delivery este mês.
                    </div>
                  )}
                  <div className="flex justify-between text-xs text-amber-900/80 pt-2 mt-2 border-t border-amber-200/60 font-medium">
                    <span>João: R$ {metricas.deliveryJoao.toFixed(2)}</span>
                    <span>Raquel: R$ {metricas.deliveryRaquel.toFixed(2)}</span>
                  </div>
                </div>

                {/* DIVISÃO RÁPIDA JOÃO E RAQUEL */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-white p-4 rounded-2xl border border-slate-200">
                    <span className="text-xs font-bold text-slate-400 block">👨 JOÃO</span>
                    <span className="text-lg font-black text-slate-800">
                      R$ {metricas.totalJoao.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </span>
                  </div>
                  <div className="bg-white p-4 rounded-2xl border border-slate-200">
                    <span className="text-xs font-bold text-slate-400 block">👩 RAQUEL</span>
                    <span className="text-lg font-black text-slate-800">
                      R$ {metricas.totalRaquel.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </span>
                  </div>
                </div>
              </div>
            )}

            {/* --- ABA CONTAS (DIA 5 & DIA 20) --- */}
            {abaAtiva === 'contas' && (
              <div className="space-y-5">
                {/* BLOCO DIA 5 */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                    <span className="text-sm font-black text-slate-800">DIA 5</span>
                    <span className="text-sm font-black text-slate-600">
                      Total: R$ {metricas.totalDia5.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </span>
                  </div>
                  <div className="space-y-2">
                    {contasFixas.filter(f => f.ativa && f.dia === 5).map(item => {
                      const pago = statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-${item.id}`];
                      return (
                        <div key={item.id} onClick={() => toggleStatus(item.id)} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer">
                          <div className="flex items-center space-x-2">
                            <span>{pago ? '🟢' : '🔴'}</span>
                            <span className={`text-sm font-semibold ${pago ? 'line-through text-slate-400' : 'text-slate-700'}`}>{item.nome}</span>
                          </div>
                          <span className="text-sm font-bold text-slate-800">R$ {item.valor.toFixed(2)}</span>
                        </div>
                      );
                    })}
                    {/* Cartão João Dia 5 */}
                    <div onClick={() => toggleStatus('j5')} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer border-t border-slate-50">
                      <div className="flex items-center space-x-2">
                        <span>{statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-j5`] ? '🟢' : '🔴'}</span>
                        <span className="text-sm font-semibold text-slate-700">Cartão João (Dia 5)</span>
                      </div>
                      <span className="text-sm font-bold text-slate-800">R$ {faturas.j5.toFixed(2)}</span>
                    </div>
                    {/* Cartão Raquel Dia 5 */}
                    <div onClick={() => toggleStatus('r5')} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer">
                      <div className="flex items-center space-x-2">
                        <span>{statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-r5`] ? '🟢' : '🔴'}</span>
                        <span className="text-sm font-semibold text-slate-700">Cartão Raquel (Dia 5)</span>
                      </div>
                      <span className="text-sm font-bold text-slate-800">R$ {faturas.r5.toFixed(2)}</span>
                    </div>
                  </div>
                </div>

                {/* BLOCO DIA 20 */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                    <span className="text-sm font-black text-slate-800">DIA 20</span>
                    <span className="text-sm font-black text-slate-600">
                      Total: R$ {metricas.totalDia20.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </span>
                  </div>
                  <div className="space-y-2">
                    {contasFixas.filter(f => f.ativa && f.dia === 20).map(item => {
                      const pago = statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-${item.id}`];
                      return (
                        <div key={item.id} onClick={() => toggleStatus(item.id)} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer">
                          <div className="flex items-center space-x-2">
                            <span>{pago ? '🟢' : '🔴'}</span>
                            <span className={`text-sm font-semibold ${pago ? 'line-through text-slate-400' : 'text-slate-700'}`}>{item.nome}</span>
                          </div>
                          <span className="text-sm font-bold text-slate-800">R$ {item.valor.toFixed(2)}</span>
                        </div>
                      );
                    })}
                    {/* Cartão João Dia 20 */}
                    <div onClick={() => toggleStatus('j20')} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer border-t border-slate-50">
                      <div className="flex items-center space-x-2">
                        <span>{statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-j20`] ? '🟢' : '🔴'}</span>
                        <span className="text-sm font-semibold text-slate-700">Cartão João (Dia 20)</span>
                      </div>
                      <span className="text-sm font-bold text-slate-800">R$ {faturas.j20.toFixed(2)}</span>
                    </div>
                    {/* Cartão Raquel Dia 20 */}
                    <div onClick={() => toggleStatus('r20')} className="flex items-center justify-between p-2 rounded-xl hover:bg-slate-50 cursor-pointer">
                      <div className="flex items-center space-x-2">
                        <span>{statusPagamento[`${dataAtual.ano}-${dataAtual.mes}-r20`] ? '🟢' : '🔴'}</span>
                        <span className="text-sm font-semibold text-slate-700">Cartão Raquel (Dia 20)</span>
                      </div>
                      <span className="text-sm font-bold text-slate-800">R$ {faturas.r20.toFixed(2)}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- ABA RELATÓRIO DE GASTOS --- */}
            {abaAtiva === 'gastos' && (
              <div className="space-y-4">
                <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-bold text-slate-400 mb-3 tracking-wider">ONDE ESTAMOS GASTANDO?</h2>
                  <div className="space-y-3">
                    {CATEGORIAS.map(cat => {
                      // Totaliza fixa + lançamentos daquela categoria
                      const totalCat = gastosMes
                        .filter(g => g.categoria === cat.id)
                        .reduce((acc, cur) => acc + cur.valor, 0)
                        + contasFixas.filter(f => f.ativa && f.categoria === cat.id).reduce((acc, cur) => acc + cur.valor, 0);

                      return (
                        <div key={cat.id} className="flex items-center justify-between">
                          <div className="flex items-center space-x-2">
                            <span className="text-lg">{cat.icon}</span>
                            <span className="text-sm font-semibold text-slate-700">{cat.label}</span>
                          </div>
                          <span className="text-sm font-bold text-slate-900">
                            R$ {totalCat.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-bold text-slate-400 mb-3 tracking-wider">DIVISÃO GERAL</h2>
                  <div className="space-y-2">
                    <div className="flex justify-between text-sm py-1 border-b border-slate-50">
                      <span className="font-semibold text-slate-700">👨 João</span>
                      <span className="font-bold text-slate-900">R$ {metricas.totalJoao.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm py-1 border-b border-slate-50">
                      <span className="font-semibold text-slate-700">👩 Raquel</span>
                      <span className="font-bold text-slate-900">R$ {metricas.totalRaquel.toFixed(2)}</span>
                    </div>
                    <div className="flex justify-between text-sm py-1">
                      <span className="font-semibold text-slate-700">👥 Compartilhado (Casal)</span>
                      <span className="font-bold text-slate-900">R$ {metricas.totalCasal.toFixed(2)}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- ABA MAIS / HISTÓRICO & CONTAS FIXAS --- */}
            {abaAtiva === 'mais' && (
              <div className="space-y-5">
                {/* GERENCIADOR DE CONTAS FIXAS */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-bold text-slate-400 mb-3 tracking-wider">CONFIGURAR CONTAS FIXAS</h2>
                  <div className="space-y-3">
                    {contasFixas.map(f => (
                      <div key={f.id} className="flex items-center justify-between bg-slate-50 p-3 rounded-xl">
                        <div>
                          <span className="text-sm font-bold text-slate-800 block">{f.nome} (Dia {f.dia})</span>
                          <span className="text-xs text-slate-400">{f.responsavel} • {f.categoria}</span>
                        </div>
                        <div className="flex items-center space-x-2">
                          <input 
                            type="number" 
                            value={f.valor} 
                            onChange={(e) => {
                              const val = parseFloat(e.target.value) || 0;
                              setContasFixas(prev => prev.map(item => item.id === f.id ? { ...item, valor: val } : item));
                            }}
                            className="w-20 bg-white border border-slate-300 rounded-lg p-1 text-right text-sm font-bold"
                          />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* HISTÓRICO COMPLETO DE GASTOS AVULSOS */}
                <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
                  <h2 className="text-xs font-bold text-slate-400 mb-3 tracking-wider">HISTÓRICO DO MÊS</h2>
                  {gastosMes.length === 0 ? (
                    <span className="text-xs text-slate-400 italic">Nenhum gasto avulso registrado.</span>
                  ) : (
                    <div className="space-y-2">
                      {gastosMes.map(g => (
                        <div key={g.id} className="flex items-center justify-between p-2 border-b border-slate-100 last:border-0">
                          <div>
                            <span className="text-sm font-bold text-slate-800 block">{g.descricao}</span>
                            <span className="text-xs text-slate-400">{g.responsavel} • {g.categoria}</span>
                          </div>
                          <div className="flex items-center space-x-3">
                            <span className="text-sm font-black text-slate-800">R$ {g.valor.toFixed(2)}</span>
                            <button onClick={() => excluirGasto(g.id)} className="text-rose-400 hover:text-rose-600 text-xs font-bold">✕</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* MODAL REGISTRO SIMPLES / LANÇAMENTO RÁPIDO */}
          {modalAberto && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-black text-slate-800">Novo Gasto</h2>
                  <button onClick={fecharModal} className="text-slate-400 text-xl font-bold">✕</button>
                </div>

                {/* ENTRADA TIPO WHATSAPP */}
                <div className="mb-4">
                  <label className="text-xs font-bold text-slate-400 block mb-1">LANÇAMENTO INTELIGENTE</label>
                  <input 
                    type="text" 
                    placeholder='Ex: "Delivery 52,90 João"' 
                    value={inputRapido}
                    onChange={(e) => parseTextoRapido(e.target.value)}
                    className="w-full bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500"
                  />
                </div>

                {/* CAMPOS REFINADOS AUTOMATICAMENTE */}
                <div className="space-y-4">
                  <div>
                    <label className="text-xs font-bold text-slate-400 block mb-1">O que você gastou?</label>
                    <input 
                      type="text" 
                      placeholder="Ex: Mercado" 
                      value={descricao}
                      onChange={(e) => setDescricao(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-400 block mb-1">Valor (R$)</label>
                    <input 
                      type="number" 
                      step="0.01" 
                      placeholder="0,00" 
                      value={valor}
                      onChange={(e) => setValor(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xl font-black text-slate-800"
                    />
                  </div>

                  {/* QUEM GASTOU */}
                  <div>
                    <label className="text-xs font-bold text-slate-400 block mb-1">Quem gastou?</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['João', 'Raquel', 'Casal'].map(p => (
                        <button 
                          key={p}
                          onClick={() => setResponsavel(p)}
                          className={`py-2 rounded-xl text-sm font-bold border ${responsavel === p ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200'}`}
                        >
                          {p.toUpperCase()}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* CATEGORIAS */}
                  <div>
                    <label className="text-xs font-bold text-slate-400 block mb-1">Categoria</label>
                    <div className="grid grid-cols-3 gap-2">
                      {CATEGORIAS.map(c => (
                        <button 
                          key={c.id}
                          onClick={() => setCategoria(c.id)}
                          className={`py-2 px-1 rounded-xl text-xs font-bold border flex items-center justify-center space-x-1 ${categoria === c.id ? 'bg-emerald-500 text-white border-emerald-500' : 'bg-white text-slate-600 border-slate-200'}`}
                        >
                          <span>{c.icon}</span>
                          <span>{c.label}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* CARTÃO & PARCELAMENTO */}
                  <div>
                    <label className="text-xs font-bold text-slate-400 block mb-1">Forma de Pagamento</label>
                    <select 
                      value={cartaoSelecionado} 
                      onChange={(e) => setCartaoSelecionado(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold mb-2"
                    >
                      {CARTAO_OPCOES.map(opt => (
                        <option key={opt.id} value={opt.id}>{opt.label}</option>
                      ))}
                    </select>

                    {cartaoSelecionado !== 'nenhum' && (
                      <div className="flex items-center space-x-2">
                        <label className="text-xs font-bold text-slate-400">Parcelas:</label>
                        <select 
                          value={parcelas} 
                          onChange={(e) => setParcelas(e.target.value)}
                          className="bg-slate-50 border border-slate-200 rounded-xl p-2 text-sm font-bold"
                        >
                          {[1, 2, 3, 4, 5, 6, 10, 12].map(n => (
                            <option key={n} value={n}>{n}x</option>
                          ))}
                        </select>
                      </div>
                    )}
                  </div>

                  {/* BOTÃO SALVAR */}
                  <button 
                    onClick={salvarGasto}
                    className="w-full bg-slate-900 text-white font-extrabold text-base py-4 rounded-2xl shadow-lg mt-2 active:bg-slate-800"
                  >
                    SALVAR GASTO
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MENU INFERIOR FIXO */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 px-4 py-2 flex justify-between items-center z-40">
            <button 
              onClick={() => setAbaAtiva('inicio')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'inicio' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">🏠</span>
              <span className="text-[10px]">Início</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('contas')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'contas' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">📋</span>
              <span className="text-[10px]">Contas</span>
            </button>
            <button 
              onClick={() => setModalAberto(true)} 
              className="bg-emerald-500 text-white rounded-full p-3 shadow-lg -translate-y-3 flex items-center justify-center border-4 border-slate-50"
            >
              <span className="text-2xl font-bold leading-none">➕</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('gastos')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'gastos' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">📊</span>
              <span className="text-[10px]">Gastos</span>
            </button>
            <button 
              onClick={() => setAbaAtiva('mais')} 
              className={`flex flex-col items-center py-1 px-2 ${abaAtiva === 'mais' ? 'text-emerald-600 font-extrabold' : 'text-slate-400 font-medium'}`}
            >
              <span className="text-xl">⚙️</span>
              <span className="text-[10px]">Mais</span>
            </button>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
