<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MB DRYFIT</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
MB <span>DRYFIT</span>
</div>


<nav>

<button onclick="mostrarPagina('inicio')">
Início
</button>

<button onclick="mostrarPagina('produtos')">
Produtos
</button>

<button onclick="mostrarPagina('vendedor')">
Vendedor
</button>

<button onclick="mostrarPagina('admin')">
Admin
</button>


<button onclick="abrirCarrinho()">
🛒 Carrinho
</button>


</nav>

</header>



<section id="inicio" class="pagina">


<div class="banner">


<h1>
MB DRYFIT
</h1>


<h2>
Performance, estilo e qualidade
</h2>


<button onclick="mostrarPagina('produtos')">
Comprar agora
</button>


</div>


</section>





<section id="produtos" class="pagina escondido">


<h1>
Produtos
</h1>


<div class="filtros">


<input 
id="busca"
placeholder="Buscar produto..."
onkeyup="buscarProduto()"
>


<select id="marcaFiltro">

<option value="">
Todas marcas
</option>

<option>
Nike
</option>

<option>
Adidas
</option>


<option>
Outras
</option>


</select>


</div>



<div id="listaProdutos">

</div>


</section>






<section id="vendedor" class="pagina escondido">


<h1>
Painel Vendedor
</h1>



<input 
id="codigoEAN"
placeholder="Digite ou bipar EAN"
>


<button onclick="buscarEAN()">
Buscar
</button>



<div id="resultadoEAN">

</div>


</section>







<section id="admin" class="pagina escondido">


<h1>
Painel Administrativo
</h1>


<input id="adminSenha"
placeholder="Senha"
type="password"
>


<button onclick="loginAdmin()">
Entrar
</button>



<div id="painelAdmin" class="escondido">


<h2>
Cadastro Produto
</h2>


<input id="nomeProduto"
placeholder="Nome produto"
>


<input id="marcaProduto"
placeholder="Marca"
>


<input id="referenciaProduto"
placeholder="Referência"
>


<button onclick="cadastrarProduto()">
Cadastrar
</button>


</div>


</section>







<div id="carrinho" class="modal escondido">


<div class="caixa">


<h2>
Carrinho
</h2>


<div id="itensCarrinho">

</div>


<button onclick="fecharCarrinho()">
Fechar
</button>


</div>


</div>






<script src="script.js"></script>


</body>

</html>
